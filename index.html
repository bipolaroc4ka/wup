let currentSheet = null;      // "about" | "privacy" | "imprint" | null
let sheetOpener = null;

function openExternal(url) {
  try {
    if (tg && /^https:\/\/t\.me\//.test(url) && tg.openTelegramLink) {
      tg.openTelegramLink(url);
    } else if (tg && tg.openLink) {
      tg.openLink(url);
    } else {
      window.open(url, "_blank", "noopener,noreferrer");
    }
  } catch {
    window.open(url, "_blank", "noopener,noreferrer");
  }
}

function externalLink(url, label, className) {
  const a = el("a", className, label);
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.dataset.ext = "1";
  return a;
}

function providerBlock() {
  const lines = [LEGAL.name, LEGAL.street, LEGAL.zipCity].map(v => (v || "").trim()).filter(Boolean);

  if (!lines.length) lines.push(t("legalMissing"));
  if ((LEGAL.email || "").trim()) lines.push(t("legalEmail", { v: LEGAL.email.trim() }));
  lines.push(t("legalContact", { v: AUTHOR_HANDLE }));

  return el("p", "provider", lines.join("\n"));
}

function renderLegalSheet(body, kind) {
  const sections = LEGAL_TEXT[lang]?.[kind] || LEGAL_TEXT.de[kind];

  if (lang !== "de") body.appendChild(el("p", "legal-note", t("legalLangNote")));

  sections.forEach(section => {
    if (section.stats && !STATS_URL) return;   // no statistics -> no paragraph

    body.appendChild(el("h4", "", section.h));

    section.p.forEach(item => {
      body.appendChild(item.provider ? providerBlock() : el("p", "", item));
    });
  });

  body.appendChild(el("p", "legal-note", t("legalUpdated", { v: LEGAL_UPDATED })));
}

function renderAboutSheet(body) {
  const brand = el("div", "about-brand");
  brand.append(el("strong", "", t("docTitle")), el("span", "muted", t("aboutVersion", { v: APP_VERSION })));
  body.appendChild(brand);

  body.appendChild(el("p", "sheet-lead", t("aboutLead")));

  const card = el("div", "about-card");
  card.appendChild(el("div", "muted", t("aboutBy")));
  card.appendChild(externalLink(AUTHOR_TELEGRAM_URL, AUTHOR_HANDLE, "about-handle"));

  const links = el("div", "about-links");
  links.append(
    externalLink(AUTHOR_TELEGRAM_URL, "Telegram", "btn-link"),
    externalLink(AUTHOR_GITHUB_URL, "GitHub", "btn-link outline")
  );
  card.appendChild(links);

  body.appendChild(card);

  body.appendChild(el("p", "", t("aboutFeedback")));
  body.appendChild(externalLink(AUTHOR_TELEGRAM_URL, t("aboutWrite"), "btn-link"));

  body.appendChild(el("p", "muted about-data", t("aboutData")));

  if (STATS_URL) {
    const label = el("label", "switch");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = statsEnabled();
    box.disabled = doNotTrack();

    box.addEventListener("change", () => {
      storageSet(STORAGE_STATS, box.checked ? "on" : "off");
    });

    const text = el("span");
    text.appendChild(document.createTextNode(t("statsLabel")));
    text.appendChild(el("small", "", doNotTrack() ? t("statsDnt") : t("statsHint")));

    label.append(box, text);
    body.appendChild(label);
  }

  const nav = el("div", "sheet-links");
  [["privacy", "linkPrivacy"], ["imprint", "linkImprint"]].forEach(([kind, key]) => {
    const b = el("button", "link-button", t(key));
    b.type = "button";
    b.addEventListener("click", () => openSheet(kind, true));
    nav.appendChild(b);
  });
  body.appendChild(nav);
}

function renderSheet() {
  const sheet = $("sheet");
  if (!currentSheet) return;

  const titleKey = { about: "sheetAbout", privacy: "sheetPrivacy", imprint: "sheetImprint" }[currentSheet];
  $("sheetTitle").textContent = t(titleKey);
  $("sheetClose").setAttribute("aria-label", t("close"));

  const body = $("sheetBody");
  body.textContent = "";

  if (currentSheet === "about") renderAboutSheet(body);
  else renderLegalSheet(body, currentSheet);

  sheet.hidden = false;
}

function openSheet(kind, keepOpener) {
  if (!keepOpener) sheetOpener = document.activeElement;
  currentSheet = kind;
  haptic();

  renderSheet();
  $("sheetBody").scrollTop = 0;
  $("sheet").querySelector(".sheet-card").scrollTop = 0;
  document.body.classList.add("no-scroll");

  try {
    if (tg?.BackButton) { tg.BackButton.show(); }
  } catch { /* ignore */ }

  $("sheetClose").focus();
}

function closeSheet() {
  if (!currentSheet) return;

  currentSheet = null;
  $("sheet").hidden = true;
  document.body.classList.remove("no-scroll");

  try { tg?.BackButton?.hide(); } catch { /* ignore */ }

  if (sheetOpener && sheetOpener.focus) sheetOpener.focus();
  sheetOpener = null;
}

try { tg?.BackButton?.onClick(closeSheet); } catch { /* ignore */ }

$("aboutButton").addEventListener("click", () => openSheet("about"));
$("sheetClose").addEventListener("click", closeSheet);

$("sheet").addEventListener("click", event => {
  if (event.target === $("sheet")) closeSheet();
});

document.querySelectorAll("[data-sheet]").forEach(button => {
  button.addEventListener("click", () => openSheet(button.dataset.sheet));
});

// External links: use Telegram's own openers inside the Mini App.
document.addEventListener("click", event => {
  const link = event.target.closest?.("a[data-ext]");
  if (!link || !tg) return;

  event.preventDefault();
  openExternal(link.href);
});

document.addEventListener("keydown", event => {
  if (!currentSheet) return;

  if (event.key === "Escape") {
    closeSheet();
    return;
  }

  // Keep keyboard focus inside the sheet.
  if (event.key === "Tab") {
    const items = [...$("sheet").querySelectorAll("a[href], button:not([disabled]), input:not([disabled])")];
    if (!items.length) return;

    const first = items[0];
    const last = items[items.length - 1];

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    } else if (!$("sheet").contains(document.activeElement)) {
      event.preventDefault();
      first.focus();
    }
  }
});

// =====================================================
// START
// =====================================================

renderAll();
track("open");

console.log("Wuppertal Verkehr started. Language:", lang);
console.log("VRR API:", API_BASE);
console.log("Telegram Mini App:", Boolean(tg));
</script>
