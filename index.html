<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="color-scheme" content="dark">
<title>Wuppertal Verkehr</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --bg: #101827;
  --panel: #1b2738;
  --panel2: #243348;
  --text: #f4f7fb;
  --muted: #a6b3c5;
  --accent: #58a6ff;
  --green: #39d98a;
  --red: #ff7373;
  --orange: #ffbd69;
  --border: #34445a;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; }

.app {
  max-width: 760px;
  margin: auto;
  padding: 20px 15px calc(40px + env(safe-area-inset-bottom));
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 22px;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  padding-top: 3px;
}

.logo span { color: var(--accent); }

.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;
}

.status {
  color: var(--muted);
  font-size: 12px;
  text-align: right;
  min-height: 15px;
}

/* ---------- language switch ---------- */

.lang-switch {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.lang-switch button {
  background: transparent;
  color: var(--muted);
  border-radius: 0;
  padding: 6px 11px;
  font-size: 12px;
  letter-spacing: .5px;
}

.lang-switch button.active {
  background: var(--accent);
  color: #081321;
}

h2 {
  font-size: 17px;
  margin: 20px 0 12px;
}

.search {
  display: flex;
  gap: 8px;
}

input {
  min-width: 0;
  flex: 1;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--text);
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: var(--accent);
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  background: var(--accent);
  color: #081321;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
.departure:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button:disabled {
  opacity: .4;
  cursor: default;
}

.secondary {
  background: var(--panel2);
  color: var(--text);
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.controls button.active,
.line-button.active {
  background: var(--accent);
  color: #081321;
}

.results {
  margin-top: 12px;
  display: grid;
  gap: 8px;
}

.stop-option {
  width: 100%;
  text-align: left;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 12px;
}

.stop-option small {
  display: block;
  color: var(--muted);
  font-weight: normal;
  margin-top: 5px;
}

.search-message {
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
}

.search-message.error { color: var(--red); }

/* ---------- recent stops ---------- */

.recent { margin-top: 4px; }

.recent-list {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.chip {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 13px;
  font-size: 13px;
  font-weight: normal;
}

/* ---------- board ---------- */

.board-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 24px;
}

.board-head h2 { margin: 0; overflow-wrap: anywhere; }

.board-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}

#refreshButton.spinning { animation: spin 1s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

.filter-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.filter-row button {
  font-size: 13px;
  padding: 9px 12px;
}

.line-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.line-button {
  background: var(--panel2);
  color: var(--text);
  padding: 8px 11px;
  font-size: 12px;
  border-radius: 8px;
}

.filter-caption {
  color: var(--muted);
  font-size: 11px;
  margin-top: 15px;
  margin-bottom: 7px;
}

.summary {
  margin-top: 14px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
}

.summary .ok { color: var(--green); }
.summary .late { color: var(--orange); }
.summary .bad { color: var(--red); }

.departures {
  margin-top: 12px;
  display: grid;
  gap: 12px;
}

.direction {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.direction-title {
  padding: 14px;
  background: var(--panel2);
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.direction-title small {
  color: var(--muted);
  font-weight: normal;
  text-align: right;
}

.departure {
  padding: 13px 14px;
  display: grid;
  grid-template-columns: 65px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border-top: 1px solid var(--border);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.departure:hover,
.departure[aria-expanded="true"] {
  background: rgba(88, 166, 255, .07);
}

.line {
  background: #dbeafe;
  color: #10233d;
  border-radius: 7px;
  padding: 6px 5px;
  text-align: center;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.time-row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 9px;
}

.time {
  font-size: 19px;
  font-weight: bold;
}

.time.struck {
  text-decoration: line-through;
  color: var(--muted);
}

.eta {
  font-size: 12px;
  font-weight: bold;
  color: var(--accent);
}

.destination {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

.delay,
.delay-minor,
.on-time,
.early,
.cancelled,
.no-rt {
  font-size: 12px;
  margin-top: 4px;
}

.delay { color: var(--red); font-weight: bold; }
.delay-minor { color: var(--orange); font-weight: bold; }
.on-time { color: var(--green); }
.early { color: var(--orange); }
.cancelled { color: var(--red); font-weight: bold; }
.no-rt { color: var(--muted); }

.chev {
  color: var(--muted);
  font-size: 13px;
  transition: transform .15s;
  text-align: right;
}

.departure[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* ---------- stop sequence of a trip ---------- */

.stops-panel {
  padding: 4px 14px 16px;
  background: rgba(0, 0, 0, .14);
  border-top: 1px dashed var(--border);
}

.stops-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
  font-size: 13px;
  font-weight: bold;
}

.stops-title small {
  color: var(--muted);
  font-weight: normal;
}

.stops-note {
  margin-top: 12px;
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}

.stops-note.error { color: var(--red); }

.stops-note button {
  padding: 7px 11px;
  font-size: 12px;
}

.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  flex: none;
}

.stop-list {
  list-style: none;
  margin: 12px 0 0 7px;
  padding: 0;
  border-left: 2px solid var(--accent);
}

.stop-list li {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 7px 0 7px 16px;
  font-size: 14px;
}

.stop-list li::before {
  content: "";
  position: absolute;
  left: -7px;
  top: 50%;
  width: 12px;
  height: 12px;
  margin-top: -6px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--accent);
}

.stop-list li.here::before,
.stop-list li.end::before {
  background: var(--accent);
}

.stop-name {
  min-width: 0;
  overflow-wrap: anywhere;
}

.stop-name small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}

.stop-time {
  white-space: nowrap;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

.stop-time small {
  margin-left: 6px;
  font-size: 11px;
}

.stop-time .late { color: var(--orange); }
.stop-time .bad { color: var(--red); }

.stops-toggle {
  margin-top: 10px;
  padding: 8px 12px;
  font-size: 12px;
}

/* ---------- misc ---------- */

.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin-top: 18px;
}

.message {
  color: var(--muted);
  text-align: center;
  padding: 24px 10px;
  line-height: 1.5;
}

.message button { margin-top: 12px; }

.error { color: var(--red); }

.data-note {
  margin-top: 14px;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  line-height: 1.6;
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin-top: 28px;
  line-height: 1.6;
}

@media (max-width: 420px) {
  .app { padding: 16px 12px calc(30px + env(safe-area-inset-bottom)); }
  .departure { grid-template-columns: 55px minmax(0, 1fr) auto; }
  .time { font-size: 17px; }
}

@media (prefers-reduced-motion: reduce) {
  .spinner, #refreshButton.spinning { animation-duration: 3s; }
  .chev { transition: none; }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">Wuppertal <span>Verkehr</span></div>

  <div class="header-right">
    <div class="lang-switch" id="langSwitch" role="group" data-i18n-aria="langLabel">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="ru">RU</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
</header>

<h2 data-i18n="searchTitle"></h2>

<div class="search">
  <input
    id="searchInput"
    data-i18n-placeholder="searchPlaceholder"
    autocomplete="off"
    maxlength="60"
  >
  <button id="searchButton" data-i18n="searchButton"></button>
</div>

<div class="controls">
  <button class="active" id="busFilter" data-i18n="filterBus"></button>
  <button class="secondary" id="allFilter" data-i18n="filterAll"></button>
</div>

<div id="searchResults" class="results"></div>
<div id="searchMessage" class="search-message" hidden></div>

<div class="recent" id="recent" hidden>
  <div class="filter-caption" data-i18n="recent"></div>
  <div class="recent-list" id="recentList"></div>
</div>

<div class="board-head">
  <h2 id="selectedStop"></h2>
  <div class="board-tools">
    <button class="secondary" id="refreshButton" data-i18n-aria="refresh">↻</button>
  </div>
</div>

<div class="filter-row">
  <button class="secondary" id="delayedFilter"></button>
  <button class="secondary" id="allLinesFilter"></button>
</div>

<div class="filter-caption" id="lineCaption" hidden data-i18n="lineCaption"></div>
<div class="line-filters" id="lineFilters"></div>

<div class="summary" id="summary" hidden></div>

<div id="board" class="departures"></div>

<div class="data-note" id="dataNote" hidden></div>

<div class="pagination" id="pagination" hidden>
  <button class="secondary" id="prevButton" data-i18n="prev"></button>
  <span id="pageLabel">1 / 1</span>
  <button class="secondary" id="nextButton" data-i18n="next"></button>
</div>

<div class="footer">
  <span data-i18n="footerSource"></span><br>
  <span data-i18n="footerRefresh"></span>
</div>

</div>

// =====================================================
// SAFE LOCAL STORAGE (can throw in private mode etc.)
// =====================================================

function storageGet(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

function storageSet(key, value) {
  try { localStorage.setItem(key, value); } catch { /* ignore */ }
}

// =====================================================

let lang = (() => {
  const saved = storageGet(STORAGE_LANG);
  return saved === "ru" || saved === "de" ? saved : "de";
})();

function t(key, vars) {
  let text = I18N[lang]?.[key] ?? I18N.de[key] ?? key;

  if (vars) {
    text = text.replace(/\{(\w+)\}/g, (match, name) =>
      vars[name] !== undefined ? String(vars[name]) : match
    );
  }

  return text;
}

function applyStaticTexts() {
  document.documentElement.lang = lang;
  document.title = t("docTitle");

  document.querySelectorAll("[data-i18n]").forEach(node => {
    node.textContent = t(node.dataset.i18n);
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach(node => {
    node.placeholder = t(node.dataset.i18nPlaceholder);
  });

  document.querySelectorAll("[data-i18n-aria]").forEach(node => {
    node.setAttribute("aria-label", t(node.dataset.i18nAria));
  });

  document.querySelectorAll("#langSwitch button").forEach(button => {
    const active = button.dataset.lang === lang;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
}

function setLanguage(newLang) {
  if (newLang === lang || !I18N[newLang]) return;

  lang = newLang;
  storageSet(STORAGE_LANG, lang);
  haptic();
  renderAll();
}

// =====================================================
// ERRORS
// =====================================================

class AppError extends Error {
  constructor(kind, vars) {
    super(kind);
    this.kind = kind;
    this.vars = vars || {};
  }
}

function explainError(error) {
  if (error?.name === "AbortError") return t("errTimeout");
  if (error instanceof AppError) return t("err_" + error.kind, error.vars);
  if (error instanceof TypeError) return t("errNetwork");
  return error?.message || t("errUnknown");
}

// =====================================================
// SMALL DOM HELPERS
// =====================================================

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// =====================================================
// API HELPERS
// =====================================================

async function apiRequest(endpoint, params) {
  const url = new URL(endpoint, API_BASE);

  Object.entries(params).forEach(([key, value]) => {
    if (value !== undefined && value !== null) {
      url.searchParams.set(key, String(value));
    }
  });

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);

  try {
    const response = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" },
      signal: controller.signal
    });

    if (!response.ok) {
      throw new AppError("http", { code: response.status });
    }

    const text = await response.text();

    try {
      return JSON.parse(text);
    } catch {
      throw new AppError("json");
    }

  } finally {
    clearTimeout(timeout);
  }
}

// EFA expects date/time in the local time of the transport region.
function berlinDateTimeParams(ms) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Berlin",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date(ms));

  const get = type => parts.find(part => part.type === type)?.value || "00";

  return {
    itdDate: get("year") + get("month") + get("day"),
    itdTime: get("hour") + get("minute")
  };
}

function dmParams(stationId, startMs, extra) {
  const params = {
    outputFormat: "rapidJSON",
    stateless: "1",
    type_dm: "any",
    name_dm: stationId,
    mode: "direct",
    useProxFootSearch: "0",
    useRealtime: "1",
    limit: String(EVENTS_LIMIT),
    ...extra
  };

  if (startMs !== null && startMs !== undefined) {
    Object.assign(params, berlinDateTimeParams(startMs));
  }

  return params;
}

// =====================================================
// NORMALIZATION
// =====================================================

function normalizeName(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

// 'de:05124:5012:0:2' (a platform) -> 'de:05124:5012' (the whole station),
// so that departures of ALL platforms / both directions are returned.
function toStationId(id) {
  const parts = String(id).split(":");
  return parts[0] === "de" && parts.length > 3
    ? parts.slice(0, 3).join(":")
    : String(id);
}

function getStopId(location) {
  const candidates = [
    location?.id,
    location?.statID,
    location?.stateless,
    location?.ref?.id,
    location?.point?.id,
    location?.properties?.id
  ];

  for (const candidate of candidates) {
    if (candidate !== undefined && candidate !== null && String(candidate).trim()) {
      return String(candidate).trim();
    }
  }

  return null;
}

function getStopName(location) {
  return (
    location?.name ||
    location?.disassembledName ||
    location?.object?.name ||
    location?.point?.name ||
    location?.properties?.name ||
    ""
  ).toString().trim();
}

function shortStopName(name) {
  return String(name).replace(/^Wuppertal,\s*/i, "");
}

// =====================================================
// RECENT STOPS
// =====================================================

function loadRecent() {
  try {
    const parsed = JSON.parse(storageGet(STORAGE_RECENT) || "[]");

    if (!Array.isArray(parsed)) return [];

    return parsed
      .filter(item =>
        item &&
        typeof item.name === "string" &&
        Array.isArray(item.ids) &&
        item.ids.length &&
        item.ids.every(id => typeof id === "string")
      )
      .slice(0, MAX_RECENT);
  } catch {
    return [];
  }
}

function pushRecent(stop) {
  const key = stopKey(stop.name);

  recentStops = [
    { name: stop.name, ids: stop.ids },
    ...recentStops.filter(item => stopKey(item.name) !== key)
  ].slice(0, MAX_RECENT);

  storageSet(STORAGE_RECENT, JSON.stringify(recentStops));
}

function renderRecent() {
  const list = $("recentList");
  list.textContent = "";

  $("recent").hidden = recentStops.length === 0;

  recentStops.forEach(stop => {
    const chip = el("button", "chip", stop.name);
    chip.type = "button";
    chip.addEventListener("click", () => selectStop(stop));
    list.appendChild(chip);
  });
}

// =====================================================
// STOP SEARCH
// =====================================================

async function searchStops() {
  const rawQuery = $("searchInput").value.trim();

  if (rawQuery.length < 2) {
    setSearchMessage({ key: "searchTooShort" });
    return;
  }

  const sequence = ++searchSequence;
  const query = rawQuery.slice(0, 60);

  // "Albertstrasse" alone may match another city, so always search in Wuppertal.
  const fullQuery = normalizeName(query).includes("wuppertal")
    ? query
    : CITY_NAME + ", " + query;

  $("searchButton").disabled = true;
  stopGroups = [];
  renderStopResults();
  setSearchMessage(null);
  setStatus("statusSearching");

  try {
    const data = await apiRequest("XML_STOPFINDER_REQUEST", {
      outputFormat: "rapidJSON",
      locationServerActive: "1",
      type_sf: "stop",
      name_sf: fullQuery,
      anyObjFilter_sf: "2"
    });

    if (sequence !== searchSequence) return;

    stopGroups = mergeStops(extractLocations(data));

    if (!stopGroups.length) {
      setSearchMessage({ key: "searchNone" });
      setStatus("statusReady");
      return;
    }

    renderStopResults();
    setStatus("statusFound", { n: stopGroups.length });

  } catch (error) {
    if (sequence !== searchSequence) return;

    console.error("StopFinder error:", error);
    setSearchMessage({ key: "searchFailed", error: true, err: error });
    setStatus("statusError");

  } finally {
    if (sequence === searchSequence) {
      $("searchButton").disabled = false;
    }
  }
}

function extractLocations(data) {
  const result = [];
  const seenArrays = new Set();

  function addArray(array) {
    if (!Array.isArray(array) || seenArrays.has(array)) return;

    seenArrays.add(array);

    for (const item of array) {
      if (item && typeof item === "object") {
        result.push(item);

        // Some answers nest stops inside "assignedStops".
        addArray(item.assignedStops);
      }
    }
  }

  addArray(data?.locations);
  addArray(data?.stopFinder?.points);
  addArray(data?.stopFinder?.locations);
  addArray(data?.stopFinder?.assignedStops);
  addArray(data?.points);
  addArray(data?.assignedStops);

  return result;
}

function isWuppertalStop(location, id, name) {
  return (
    String(id).startsWith(CITY_ID_PREFIX) ||
    normalizeName(name).includes("wuppertal") ||
    String(location?.city?.name || "").toLowerCase() === "wuppertal"
  );
}

// A name key that ignores everything that only differs in spelling:
// "Wuppertal, Blankstraße", "Blankstrasse" and "Wuppertal Blankstr." all
// become "blankstr", "Wuppertal, Wuppertal Hbf" and "Hbf" become "hbf".
function stopKey(name) {
  const key = normalizeName(name)
    .replace(/ß/g, "ss")
    .replace(/wuppertal/g, "")
    .replace(/strasse/g, "str")
    .replace(/[^a-z0-9]/g, "");

  return key || normalizeName(name);
}

// Merges search results that describe the SAME stop into ONE entry:
//  - entries with the same (normalized) name, usually the two sides of a street,
//    are one stop with several station ids; the board loads all of them;
//  - entries that share a station id are the same stop even if VRR spells
//    the name differently, so they must not be offered twice.
function mergeStops(locations) {
  const groups = [];

  for (const location of locations) {
    const rawId = getStopId(location);
    const name = getStopName(location);

    if (!rawId || !name) continue;
    if (!isWuppertalStop(location, rawId, name)) continue;

    const id = toStationId(rawId);
    const key = stopKey(name);

    const matches = groups.filter(group =>
      group.keys.has(key) || group.ids.includes(id)
    );

    let target;

    if (!matches.length) {
      target = { name, keys: new Set(), ids: [] };
      groups.push(target);
    } else {
      target = matches[0];

      // This entry links several groups together -> fold them into one.
      matches.slice(1).forEach(other => {
        other.ids.forEach(otherId => {
          if (!target.ids.includes(otherId)) target.ids.push(otherId);
        });
        other.keys.forEach(otherKey => target.keys.add(otherKey));
        groups.splice(groups.indexOf(other), 1);
      });

      // Prefer the spelling that includes the city, e.g. "Wuppertal, Hbf".
      if (!/^wuppertal/i.test(target.name) && /^wuppertal/i.test(name)) {
        target.name = name;
      }
    }

    target.keys.add(key);

    if (!target.ids.includes(id)) target.ids.push(id);
  }

  // Keep the order from VRR: the best match comes first.
  return groups
    .slice(0, MAX_SEARCH_RESULTS)
    .map(group => ({
      name: group.name,
      ids: group.ids.slice(0, MAX_IDS_PER_STOP)
    }));
}

// 'de:05124:11376' -> '11376' (short form shown in the result list).
function shortId(id) {
  return String(id).split(":").pop();
}

function renderStopResults() {

function resolveMessage(message) {

    ...(message.vars || {}),
    reason: message.err ? explainError(message.err) : ""
  }).trim();
}

function clearDepartureCacheFor(ids) {
  for (const key of [...departureCache.keys()]) {
    if (ids.some(id => key.startsWith(id + "|"))) {
      departureCache.delete(key);
    }
  }
}

async function selectStop(stop) {
  if (!stop?.ids?.length) return;

  selectedStop = { name: stop.name, ids: [...stop.ids] };
  currentPage = 0;
  selectedLine = null;
  onlyDelayed = false;

  allDepartures = [];
  directionGroups = [];
  summaryStats = null;
  dataUntil = null;

  expanded.clear();
  showAllStops.clear();
  tripCache.clear();
  clearDepartureCacheFor(selectedStop.ids);

  stopGroups = [];
  renderStopResults();
  setSearchMessage(null);

  pushRecent(selectedStop);
  renderRecent();

  renderBoardTitle();
  updateFilterButtons();
  renderLineFilters();
  showMessage({ key: "loadingBoard" });

  haptic();
  startAutoRefresh();
  await refreshDepartures();
}

// =====================================================
// DATE PARSING
// =====================================================

function parseDate(value) {
  if (!value) return null;

  if (value instanceof Date) {
    return Number.isNaN(value.getTime()) ? null : value;
  }

  if (typeof value === "number") {
    const date = new Date(value < 1000000000000 ? value * 1000 : value);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  if (typeof value === "string") {
    const trimmed = value.trim();

    if (!trimmed) return null;

    const date = new Date(trimmed);

    if (!Number.isNaN(date.getTime())) {
      return date;
    }

    const match = trimmed.match(
      /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );

    if (match) {
      return new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3]),
        Number(match[4]),
        Number(match[5]),
        Number(match[6] || 0)
      );
    }

    return null;
  }

  if (typeof value === "object") {
    const year = Number(value.year);
    const month = Number(value.month);
    const day = Number(value.day);
    const hour = Number(value.hour);
    const minute = Number(value.minute);
    const second = Number(value.second || 0);

    if (
      Number.isFinite(year) &&
      Number.isFinite(month) &&
      Number.isFinite(day) &&
      Number.isFinite(hour) &&
      Number.isFinite(minute)
    ) {
      return new Date(year, month - 1, day, hour, minute, second);
    }

    if (value.timestamp) return parseDate(value.timestamp);
    if (value.dateTime) return parseDate(value.dateTime);
  }

  return null;
}

function formatTime(date) {
  return date.toLocaleTimeString("de-DE", {
    hour: "2-digit",
    minute: "2-digit",
    timeZone: "Europe/Berlin"
  });
}

// =====================================================
// DEPARTURE PARSING
// =====================================================

function extractDepartures(data) {
  const result = [];

  if (Array.isArray(data?.departureList)) result.push(...data.departureList);
  if (Array.isArray(data?.stopEvents)) result.push(...data.stopEvents);
  if (Array.isArray(data?.departures)) result.push(...data.departures);

  return result;
}

function getProductText(transport, servingLine) {
  const product = transport?.product || servingLine?.product;

  let text;

  if (typeof product === "string" || typeof product === "number") {
    text = String(product);
  } else {
    text = String(
      product?.name ||
      product?.description ||
      product?.shortName ||
      ""
    );
  }

  // "Bus 628" in the transport name is a good hint when no product is given.
  return (text + " " + String(transport?.name || "")).trim();
}

function getProductClass(transport, servingLine) {
  const product = transport?.product || servingLine?.product;

  const candidates = [
    product?.class,
    product?.motType,
    servingLine?.motType,
    transport?.motType
  ];

  for (const value of candidates) {
    if (value === null || value === undefined || value === "") continue;

    const number = Number(value);

    if (Number.isFinite(number)) return number;
  }

  return null;
}

function isCancelledItem(item) {
  const flags = [
    item?.isCancelled,
    item?.cancelled,
    item?.isCanceled,
    item?.canceled,
    item?.cancelledTrip
  ];

  if (flags.some(value => value === true || value === 1 || value === "true")) {
    return true;
  }

  // realtimeStatus is an ARRAY in rapidJSON (e.g. ["MONITORED", "TRIP_CANCELLED"]).
  const status = item?.realtimeStatus;
  const list = Array.isArray(status) ? status : [status];

  return list.some(value =>
    typeof value === "string" && /cancel|ausfall/i.test(value)
  );
}

function parseDeparture(item, stationId) {
  const transport = item?.transportation || {};
  const servingLine = item?.servingLine || {};

  const planned =
    parseDate(item?.departureTimePlanned) ||
    parseDate(item?.dateTime) ||
    parseDate(item?.departureTime) ||
    parseDate(item?.plannedDateTime);

  if (!planned) return null;

  const estimatedRaw =
    parseDate(item?.departureTimeEstimated) ||
    parseDate(item?.realDateTime) ||
    parseDate(item?.estimatedDateTime);

  const estimated = estimatedRaw || planned;

  const destinationValue =
    transport?.destination?.name ||
    transport?.destination ||
    servingLine?.direction ||
    item?.direction ||
    item?.destination?.name ||
    item?.destination ||
    "—";

  const number =
    servingLine?.number ||
    transport?.number ||
    transport?.disassembledName ||
    servingLine?.name ||
    transport?.name ||
    "?";

  const platformValue =
    item?.location?.properties?.platformName ||
    item?.platformName ||
    item?.platform?.name ||
    item?.platform ||
    item?.stop?.platformName ||
    "";

  const line = String(number).trim();
  const destination = String(destinationValue).trim();

  const departure = {
    stationId: stationId || "",
    line,
    destination,
    platform: typeof platformValue === "object"
      ? String(platformValue.name || platformValue.number || "")
      : String(platformValue),
    product: getProductText(transport, servingLine),
    productClass: getProductClass(transport, servingLine),
    planned,
    estimated,
    timestamp: estimated.getTime(),
    plannedTimestamp: planned.getTime(),
    hasRealtime: Boolean(estimatedRaw),
    delay: estimatedRaw
      ? Math.round((estimatedRaw.getTime() - planned.getTime()) / 60000)
      : 0,
    cancelled: isCancelledItem(item),
    isBus: false,
    id: ""
  };

  departure.isBus = classifyBus(departure);
  departure.id = [
    departure.stationId,
    line,
    departure.plannedTimestamp,
    normalizeName(destination)
  ].join("|");

  return departure;
}

function classifyBus(departure) {
  if (BUS_CLASSES.has(departure.productClass)) return true;
  if (departure.productClass !== null) return false;

  // No class given: decide by the product / transport name.
  return /bus/.test(normalizeName(departure.product));
}

function isFutureDeparture(item) {
  return item.timestamp >= Date.now() - 60000;
}

function deduplicateDepartures(items) {
  const unique = new Map();

  for (const item of items) {
    const key = [
      item.line,
      normalizeName(item.destination),
      item.platform,
      item.plannedTimestamp,
      item.timestamp,
      item.cancelled
    ].join("|");

    const existing = unique.get(key);

    if (!existing) {
      unique.set(key, item);
    } else if (!existing.platform && item.platform) {
      existing.platform = item.platform;
    }
  }

  return [...unique.values()];
}

// =====================================================
// DEPARTURE REQUESTS
// =====================================================

// Departures of ONE station id.
// deep = false: one request (next N events).
// deep = true : several requests, each starting where the previous one ended,
//               until DEEP_HORIZON_MIN minutes are covered. EFA returns only
//               the next N events, so at a busy hub a rare line could
//               otherwise show up in one direction only.
async function fetchStationDepartures(stationId, deep) {
  const cacheKey = stationId + "|" + (deep ? "deep" : "std");
  const cached = departureCache.get(cacheKey);

  if (cached && Date.now() - cached.timestamp < CACHE_TTL) {
    return cached.data;
  }

  const collected = new Map();
  const horizonEnd = Date.now() + DEEP_HORIZON_MIN * 60000;
  let start = null;

  const pages = deep ? DEEP_MAX_PAGES : 1;

  for (let page = 0; page < pages; page++) {
    let data;

    try {
      data = await apiRequest("XML_DM_REQUEST", dmParams(stationId, start));
    } catch (error) {
      if (page === 0) throw error;   // nothing at all -> report the error
      break;                         // a later page failed -> keep what we have
    }

    const parsed = extractDepartures(data)
      .map(raw => parseDeparture(raw, stationId))
      .filter(Boolean);

    parsed.forEach(dep => {
      if (!collected.has(dep.id)) collected.set(dep.id, dep);
    });

    if (!parsed.length) break;

    const last = Math.max(...parsed.map(dep => dep.timestamp));

    // Stop when the horizon is covered or the window did not move forward.
    if (last >= horizonEnd || (start !== null && last <= start)) break;

    start = last;
  }

  const result = [...collected.values()];

  departureCache.set(cacheKey, { timestamp: Date.now(), data: result });

  return result;
}

async function refreshDepartures() {
  if (!selectedStop) return;

  const stop = selectedStop;
  const seq = ++refreshSeq;
  const deep = Boolean(selectedLine);

  setLoading(true);
  setStatus("statusUpdating");

  try {
    const results = await Promise.all(
      stop.ids.map(id =>
        fetchStationDepartures(id, deep).catch(error => {
          console.error("Departure request failed:", id, error);
          return null;
        })
      )
    );

    // A newer refresh or another stop replaced this one: drop the result.
    if (seq !== refreshSeq || stop !== selectedStop) return;

    const successful = results.filter(Boolean);

    if (!successful.length) {
      throw new AppError("allFailed");
    }

    const received = successful.flat();

    dataUntil = received.length
      ? Math.max(...received.map(dep => dep.timestamp))
      : null;

    allDepartures = deduplicateDepartures(received)
      .filter(isFutureDeparture)
      .sort((a, b) => a.timestamp - b.timestamp);

    // Forget opened departures that have already left.
    const alive = new Set(allDepartures.map(dep => dep.id));
    [...expanded].forEach(id => { if (!alive.has(id)) expanded.delete(id); });

    boardMessage = null;
    buildDirectionGroups();
    renderLineFilters();
    renderBoard();

    const time = new Date().toLocaleTimeString("de-DE", {
      hour: "2-digit",
      minute: "2-digit"
    });

    setStatus(
      successful.length < stop.ids.length ? "statusUpdatedPartial" : "statusUpdated",
      { time }
    );

    refreshOpenTrips();

  } catch (error) {
    if (seq !== refreshSeq || stop !== selectedStop) return;

    console.error("Departure error:", error);
    setStatus("statusError");

    // Keep showing the old data if we have it; otherwise show the error.
    if (!allDepartures.length) {
      showMessage({ key: "departuresFailed", error: true, err: error });
    }

  } finally {
    if (seq === refreshSeq) setLoading(false);
  }
}

// =====================================================
// STOP SEQUENCE OF A TRIP ("next stops")
// =====================================================

function onwardFromRaw(raw) {
  const list = raw?.onwardLocations;

  if (!Array.isArray(list)) return [];

  return list
    .map(location => {
      const name =
        location?.parent?.name ||
        location?.name ||
        location?.disassembledName ||
        "";

      if (!name) return null;

      const planned = parseDate(
        location?.arrivalTimePlanned || location?.departureTimePlanned
      );
      const estimatedRaw = parseDate(
        location?.arrivalTimeEstimated || location?.departureTimeEstimated
      );

      return {
        name: String(name),
        planned,
        estimated: estimatedRaw || planned,
        delay: planned && estimatedRaw
          ? Math.round((estimatedRaw.getTime() - planned.getTime()) / 60000)
          : 0
      };
    })
    .filter(Boolean);
}

// There is no "get trip by id" call in the departure monitor, so we ask for
// the events around the departure time WITH the complete stop sequence and
// pick the matching trip out of them.
async function fetchTripStops(dep) {
  const start = dep.plannedTimestamp - 120000;

  const extra = {
    limit: String(TRIP_EVENTS_LIMIT),
    includeCompleteStopSeq: "1"
  };

  let data;

  try {
    data = await apiRequest(
      "XML_DM_REQUEST",
      dmParams(dep.stationId, start, { ...extra, depType: "stopEvents" })
    );
  } catch {
    // Retry without depType in case the proxy/server dislikes it.
    data = await apiRequest("XML_DM_REQUEST", dmParams(dep.stationId, start, extra));
  }

  const wantedDestination = normalizeName(dep.destination);

  const candidates = extractDepartures(data)
    .map(raw => ({ raw, parsed: parseDeparture(raw, dep.stationId) }))
    .filter(item => item.parsed && item.parsed.line === dep.line)
    .filter(item => normalizeName(item.parsed.destination) === wantedDestination);

  const match =
    candidates.find(item => item.parsed.plannedTimestamp === dep.plannedTimestamp) ||
    candidates.find(item =>
      Math.abs(item.parsed.plannedTimestamp - dep.plannedTimestamp) <= 120000
    );

  if (!match) return [];

  const stops = onwardFromRaw(match.raw);

  if (!stops.length) {
    console.warn("VRR returned no onwardLocations. Fields:", Object.keys(match.raw));
  }

  return stops;
}

async function loadTrip(dep, force = false) {
  const previous = tripCache.get(dep.id);

  if (previous?.status === "loading") return;

  if (!force && previous?.status === "ok" && Date.now() - previous.ts < TRIP_TTL) {
    return;
  }

  tripCache.set(dep.id, {
    status: "loading",
    stops: previous?.stops || [],
    ts: previous?.ts || 0
  });
  updateTripPanel(dep.id);

  try {
    const stops = await fetchTripStops(dep);

    tripCache.set(dep.id, {
      status: stops.length ? "ok" : "empty",
      stops,
      ts: Date.now()
    });

  } catch (error) {
    console.error("Trip request failed:", dep.id, error);

    tripCache.set(dep.id, {
      status: "error",
      stops: previous?.stops || [],
      ts: Date.now()
    });
  }

  updateTripPanel(dep.id);
}

function refreshOpenTrips() {
  for (const { dep } of tripRefs.values()) {
    if (expanded.has(dep.id)) loadTrip(dep);
  }
}

function updateTripPanel(id) {
  const ref = tripRefs.get(id);

  if (ref) renderTripPanel(ref.panel, ref.dep);
}

function renderTripPanel(panel, dep) {
  panel.textContent = "";

  const state = tripCache.get(dep.id);
  const stops = state?.stops || [];

  const title = el("div", "stops-title");
  title.appendChild(el("span", "", t("tripTitle")));

  if (stops.length) {
    title.appendChild(el("small", "", t("tripCount", { n: stops.length })));
  }

  panel.appendChild(title);

  if (!state || (state.status === "loading" && !stops.length)) {
    const note = el("div", "stops-note");
    note.append(el("span", "spinner"), el("span", "", t("tripLoading")));
    panel.appendChild(note);
    return;
  }

  if (state.status === "error" && !stops.length) {
    const note = el("div", "stops-note error");
    note.appendChild(el("span", "", t("tripError")));

    const retry = el("button", "secondary", t("retry"));
    retry.type = "button";
    retry.addEventListener("click", event => {
      event.stopPropagation();
      loadTrip(dep, true);
    });

    note.appendChild(retry);
    panel.appendChild(note);
    return;
  }

  if (!stops.length) {
    panel.appendChild(el("div", "stops-note", t("tripEmpty")));
    return;
  }

  const fullList = showAllStops.has(dep.id);
  const visible = fullList ? stops : stops.slice(0, TRIP_PREVIEW_COUNT);

  const list = el("ul", "stop-list");

  // First row: where the passenger is right now.
  const here = el("li", "here");
  const hereName = el("span", "stop-name", selectedStop ? selectedStop.name : "");
  hereName.appendChild(el("small", "", t("tripHere")));
  here.append(hereName, el("span", "stop-time", formatTime(dep.estimated)));
  list.appendChild(here);

  visible.forEach((stop, index) => {
    const isLast = fullList && index === visible.length - 1;

    const item = el("li", isLast ? "end" : "");
    const name = el("span", "stop-name", shortStopName(stop.name));

    if (isLast) name.appendChild(el("small", "", t("tripEnd")));

    const time = el(
      "span",
      "stop-time",
      stop.estimated ? formatTime(stop.estimated) : "--:--"
    );

    if (stop.delay >= 1) {
      time.appendChild(
        el("small", stop.delay >= MAJOR_DELAY_MIN ? "bad" : "late", "+" + stop.delay)
      );
    }

    item.append(name, time);
    list.appendChild(item);
  });

  panel.appendChild(list);

  if (stops.length > TRIP_PREVIEW_COUNT) {
    const toggle = el(
      "button",
      "secondary stops-toggle",
      fullList ? t("tripShowLess") : t("tripShowAll", { n: stops.length })
    );
    toggle.type = "button";
    toggle.addEventListener("click", event => {
      event.stopPropagation();

      if (showAllStops.has(dep.id)) showAllStops.delete(dep.id);
      else showAllStops.add(dep.id);

      renderTripPanel(panel, dep);
    });

    panel.appendChild(toggle);
  }
}

// =====================================================
// FILTERING AND GROUPING
// =====================================================

function getFilteredDepartures() {
  let result = [...allDepartures];

  if (transportFilter === "bus") {
    result = result.filter(item => item.isBus);
  }

  if (onlyDelayed) {
    result = result.filter(item => item.cancelled || item.delay >= DELAYED_MIN);
  }

  if (selectedLine) {
    result = result.filter(item => item.line === selectedLine);
  }

  return result.sort((a, b) => a.timestamp - b.timestamp);
}

function buildDirectionGroups() {
  const departures = getFilteredDepartures();
  const groups = new Map();

  // One card per direction: destination + platform (the two sides of a
  // street have different platforms even if the destination text is similar).
  for (const departure of departures) {
    const key = normalizeName(departure.destination) + "|" + departure.platform;

    if (!groups.has(key)) {
      groups.set(key, {
        destination: departure.destination,
        platform: departure.platform,
        total: 0,
        departures: []
      });
    }

    const group = groups.get(key);
    group.total++;
    group.departures.push(departure);
  }

  const perDirection = selectedLine
    ? DEPARTURES_PER_DIRECTION_WITH_LINE
    : DEPARTURES_PER_DIRECTION;

  directionGroups = [...groups.values()]
    .map(group => ({
      ...group,
      departures: group.departures
        .sort((a, b) => a.timestamp - b.timestamp)
        .slice(0, perDirection)
    }))
    .sort((a, b) => {
      const timeA = a.departures[0]?.timestamp || Infinity;
      const timeB = b.departures[0]?.timestamp || Infinity;

      return timeA - timeB;
    });

  // Delay statistics over everything that matches the filters.
  const active = departures.filter(item => !item.cancelled);
  const late = active.filter(item => item.delay >= 1);

  summaryStats = departures.length
    ? {
        onTime: active.filter(item => item.hasRealtime && item.delay <= 0).length,
        late: late.length,
        maxLate: late.reduce((max, item) => Math.max(max, item.delay), 0),
        cancelled: departures.length - active.length
      }
    : null;

  const totalPages = Math.max(1, Math.ceil(directionGroups.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages - 1);
}

// =====================================================
// LINE FILTER BUTTONS
// =====================================================

function renderLineFilters() {
  const container = $("lineFilters");
  const caption = $("lineCaption");

  container.textContent = "";

  const departures = allDepartures.filter(item =>
    transportFilter === "all" || item.isBus
  );

  const lineSet = new Set(departures.map(item => item.line).filter(Boolean));

  // The selected line stays visible even if it has no departures right now.
  if (selectedLine) lineSet.add(selectedLine);

  const lines = [...lineSet].sort((a, b) =>
    a.localeCompare(b, "de", { numeric: true })
  );

  caption.hidden = lines.length === 0;

  lines.slice(0, MAX_LINE_BUTTONS).forEach(lineNumber => {
    const button = el("button", "line-button", lineNumber);
    button.type = "button";

    if (selectedLine === lineNumber) {
      button.classList.add("active");
    }

    button.addEventListener("click", () => {
      haptic();
      selectedLine = selectedLine === lineNumber ? null : lineNumber;
      onFilterChanged({ reload: true });
    });

    container.appendChild(button);
  });
}

function updateFilterButtons() {
  $("busFilter").className = transportFilter === "bus" ? "active" : "secondary";
  $("allFilter").className = transportFilter === "all" ? "active" : "secondary";
  $("delayedFilter").className = onlyDelayed ? "active" : "secondary";
  $("allLinesFilter").className = selectedLine ? "active" : "secondary";

  $("delayedFilter").textContent = t("filterDelayed");
  $("allLinesFilter").textContent = selectedLine
    ? t("filterLineSel", { line: selectedLine })
    : t("filterAllLines");

  $("busFilter").setAttribute("aria-pressed", String(transportFilter === "bus"));
  $("allFilter").setAttribute("aria-pressed", String(transportFilter === "all"));
  $("delayedFilter").setAttribute("aria-pressed", String(onlyDelayed));
}

// Re-applies the filters. With reload = true the data is fetched again,
// because a selected line is loaded further ahead in time (deep mode).
function onFilterChanged({ reload = false } = {}) {
  currentPage = 0;

  updateFilterButtons();
  renderLineFilters();

  if (selectedStop && !boardMessage) {
    buildDirectionGroups();
  }

  renderBoard();

  if (reload && selectedStop) refreshDepartures();
}

// =====================================================
// RENDER BOARD
// =====================================================

function emptyMessage() {
  if (onlyDelayed) {
    return { key: "noDelayed", vars: { min: DELAYED_MIN } };
  }

  if (selectedLine) {
    return { key: "noLine", vars: { line: selectedLine } };
  }

  if (transportFilter === "bus" && allDepartures.length) {
    return { key: "noBuses", vars: { n: allDepartures.length } };
  }

  return { key: "noDepartures" };
}

function renderMessage(container, message) {
  const box = el("div", message.error ? "message error" : "message");
  box.textContent = resolveMessage(message);

  if (message.error && selectedStop) {
    const retry = el("button", "secondary", t("retry"));
    retry.type = "button";
    retry.addEventListener("click", () => refreshDepartures());

    box.append(document.createElement("br"), retry);
  }

  container.appendChild(box);
}

function showMessage(message) {
  boardMessage = message;
  renderBoard();
}

function countText(n) {
  return t(n === 1 ? "countOne" : "countMany", { n });
}

function renderSummary() {
  const box = $("summary");
  box.textContent = "";

  if (!summaryStats) {
    box.hidden = true;
    return;
  }

  const { onTime, late, maxLate, cancelled } = summaryStats;

  box.appendChild(el("span", "ok", t("sumOnTime", { n: onTime })));

  if (late) {
    box.appendChild(el(
      "span",
      maxLate >= MAJOR_DELAY_MIN ? "bad" : "late",
      t("sumLate", { n: late, max: maxLate })
    ));
  }

  if (cancelled) {
    box.appendChild(el("span", "bad", t("sumCancelled", { n: cancelled })));
  }

  box.hidden = false;
}

function renderDataNote(showDirectionHint) {
  const box = $("dataNote");
  box.textContent = "";

  const lines = [];

  if (dataUntil) {
    lines.push(t("dataUntil", { time: formatTime(new Date(dataUntil)) }));
  }

  if (showDirectionHint) {
    lines.push(t("singleDirection", { line: selectedLine }));
  }

  lines.forEach((text, index) => {
    if (index) box.appendChild(document.createElement("br"));
    box.appendChild(document.createTextNode(text));
  });

  box.hidden = lines.length === 0;
}

function etaText(dep) {
  const minutes = Math.floor((dep.timestamp - Date.now()) / 60000);

  if (minutes <= 0) return t("etaNow");

  if (minutes >= 60) {
    return t("etaHours", {
      h: Math.floor(minutes / 60),
      m: String(minutes % 60).padStart(2, "0")
    });
  }

  return t("etaMin", { n: minutes });
}

function renderStatusLine(dep) {
  if (dep.cancelled) return el("div", "cancelled", t("cancelled"));
  if (!dep.hasRealtime) return el("div", "no-rt", t("noRealtime"));

  if (dep.delay >= MAJOR_DELAY_MIN) {
    return el("div", "delay", t("delay", { n: dep.delay }));
  }

  if (dep.delay >= 1) {
    return el("div", "delay-minor", t("delay", { n: dep.delay }));
  }

  if (dep.delay <= -1) {
    return el("div", "early", t("early", { n: Math.abs(dep.delay) }));
  }

  return el("div", "on-time", t("onTime"));
}

function renderDeparture(dep) {
  const wrap = el("div", "dep-wrap");

  const row = el("div", "departure");
  row.tabIndex = 0;
  row.setAttribute("role", "button");

  const panel = el("div", "stops-panel");
  panel.hidden = !expanded.has(dep.id);

  row.setAttribute("aria-expanded", String(expanded.has(dep.id)));

  const line = el("div", "line", dep.line);

  const info = el("div");

  const timeRow = el("div", "time-row");
  const time = el(
    "span",
    dep.cancelled ? "time struck" : "time",
    formatTime(dep.estimated)
  );
  timeRow.appendChild(time);

  if (!dep.cancelled) {
    const eta = el("span", "eta", etaText(dep));
    timeRow.appendChild(eta);
    etaRefs.push({ el: eta, dep });
  }

  const planned = el("div", "destination", t("planned", { time: formatTime(dep.planned) }));

  info.append(timeRow, planned, renderStatusLine(dep));

  const chevron = el("div", "chev", "▾");
  chevron.setAttribute("aria-hidden", "true");

  row.append(line, info, chevron);
  wrap.append(row, panel);

  tripRefs.set(dep.id, { panel, dep });

  if (expanded.has(dep.id)) {
    renderTripPanel(panel, dep);
  }

  const toggle = () => {
    haptic();

    if (expanded.has(dep.id)) {
      expanded.delete(dep.id);
    } else {
      expanded.add(dep.id);
      renderTripPanel(panel, dep);
      loadTrip(dep);
    }

    const open = expanded.has(dep.id);
    row.setAttribute("aria-expanded", String(open));
    panel.hidden = !open;
  };

  row.addEventListener("click", toggle);
  row.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      toggle();
    }
  });

  return wrap;
}

function renderBoard() {
  const container = $("board");
  container.textContent = "";

  etaRefs = [];
  tripRefs.clear();

  $("summary").hidden = true;
  $("pagination").hidden = true;
  $("dataNote").hidden = true;

  if (boardMessage) {
    renderMessage(container, boardMessage);
    return;
  }

  if (!selectedStop) {
    renderMessage(container, { key: "boardHint" });
    return;
  }

  if (!directionGroups.length) {
    renderMessage(container, emptyMessage());
    renderDataNote(false);
    return;
  }

  const totalPages = Math.ceil(directionGroups.length / PAGE_SIZE);
  currentPage = Math.min(currentPage, totalPages - 1);

  const start = currentPage * PAGE_SIZE;
  const pageGroups = directionGroups.slice(start, start + PAGE_SIZE);

  renderSummary();

  pageGroups.forEach(group => {
    const card = el("div", "direction");

    const title = el("div", "direction-title");
    title.appendChild(el("span", "", group.destination));

    const meta = group.platform
      ? t("platform", { p: group.platform }) + " · " + countText(group.total)
      : countText(group.total);

    title.appendChild(el("small", "", meta));
    card.appendChild(title);

    group.departures.forEach(dep => card.appendChild(renderDeparture(dep)));

    container.appendChild(card);
  });

  $("pagination").hidden = totalPages <= 1;
  $("pageLabel").textContent = (currentPage + 1) + " / " + totalPages;
  $("prevButton").disabled = currentPage === 0;
  $("nextButton").disabled = currentPage >= totalPages - 1;

  const singleDirection =
    Boolean(selectedLine) && !onlyDelayed && directionGroups.length === 1;

  renderDataNote(singleDirection);
}

function renderBoardTitle() {
  $("selectedStop").textContent = selectedStop
    ? selectedStop.name
    : t("boardTitle");
}

// =====================================================
// UI HELPERS
// =====================================================

function setStatus(key, vars) {
  statusState = { key, vars: vars || null };
  renderStatus();
}

function renderStatus() {
  $("status").textContent = t(statusState.key, statusState.vars);
}

function setLoading(flag) {
  $("refreshButton").disabled = flag;
  $("refreshButton").classList.toggle("spinning", flag);
}

// Re-renders everything that contains text (used when the language changes).
function renderAll() {
  applyStaticTexts();
  updateFilterButtons();
  renderBoardTitle();
  renderRecent();
  renderStopResults();
  renderSearchMessage();
  renderLineFilters();
  renderStatus();
  renderBoard();
}

// =====================================================
// EVENTS
// =====================================================

document.querySelectorAll("#langSwitch button").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.lang));
});

$("busFilter").addEventListener("click", () => {
  transportFilter = "bus";
  selectedLine = null;
  onFilterChanged();
});

$("allFilter").addEventListener("click", () => {
  transportFilter = "all";
  selectedLine = null;
  onFilterChanged();
});

$("delayedFilter").addEventListener("click", () => {
  onlyDelayed = !onlyDelayed;
  onFilterChanged();
});

$("allLinesFilter").addEventListener("click", () => {
  const hadLine = Boolean(selectedLine);
  selectedLine = null;
  onFilterChanged({ reload: hadLine });
});

$("prevButton").addEventListener("click", () => {
  if (currentPage > 0) {
    currentPage--;
    renderBoard();
  }
});

$("nextButton").addEventListener("click", () => {
  const pages = Math.ceil(directionGroups.length / PAGE_SIZE);

  if (currentPage < pages - 1) {
    currentPage++;
    renderBoard();
  }
});

$("searchButton").addEventListener("click", searchStops);

$("searchInput").addEventListener("keydown", event => {
  if (event.key === "Enter") searchStops();
});

$("refreshButton").addEventListener("click", () => {
  // Forced refresh: drop the cache of the selected stop.
  if (selectedStop) clearDepartureCacheFor(selectedStop.ids);

  refreshDepartures();
});

// =====================================================
// AUTO REFRESH AND COUNTDOWN
// =====================================================

function startAutoRefresh() {
  stopAutoRefresh();

  refreshTimer = setInterval(() => {
    if (selectedStop && !document.hidden) {
      refreshDepartures();
    }
  }, REFRESH_INTERVAL);
}

function stopAutoRefresh() {
  if (refreshTimer) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

// Updates the "in N min" labels without a network request and removes
// departures that have already left.
etaTimer = setInterval(() => {
  if (document.hidden || !selectedStop || boardMessage) return;

  if (allDepartures.some(item => !isFutureDeparture(item))) {
    allDepartures = allDepartures.filter(isFutureDeparture);
    buildDirectionGroups();
    renderLineFilters();
    renderBoard();
    return;
  }

  etaRefs.forEach(({ el: node, dep }) => {
    node.textContent = etaText(dep);
  });
}, ETA_TICK_INTERVAL);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && selectedStop) {
    clearDepartureCacheFor(selectedStop.ids);
    refreshDepartures();
  }
});

// =====================================================
// START
// =====================================================

renderAll();

console.log("Wuppertal Verkehr started. Language:", lang);
console.log("VRR API:", API_BASE);
console.log("Telegram Mini App:", Boolean(tg));
</script>
