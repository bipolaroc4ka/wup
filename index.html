
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Wuppertal Verkehr</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --bg: #101827;
  --panel: #1b2738;
  --panel2: #243348;
  --text: #f4f7fb;
  --muted: #a6b3c5;
  --accent: #58a6ff;
  --green: #39d98a;
  --red: #ff7373;
  --orange: #ffbd69;
  --border: #34445a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; }

.app {
  max-width: 760px;
  margin: auto;
  padding: 20px 15px calc(40px + env(safe-area-inset-bottom));
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}

.logo {
  font-size: 22px;
  font-weight: 800;
}

.logo span { color: var(--accent); }

.status {
  color: var(--muted);
  font-size: 12px;
  text-align: right;
}

h2 {
  font-size: 17px;
  margin: 20px 0 12px;
}

.search {
  display: flex;
  gap: 8px;
}

input {
  min-width: 0;
  flex: 1;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--text);
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: var(--accent);
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  background: var(--accent);
  color: #081321;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  opacity: .4;
  cursor: default;
}

.secondary {
  background: var(--panel2);
  color: var(--text);
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.controls button.active,
.line-button.active {
  background: var(--accent);
  color: #081321;
}

.results {
  margin-top: 12px;
  display: grid;
  gap: 8px;
}

.stop-option {
  width: 100%;
  text-align: left;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 12px;
}

.stop-option small {
  display: block;
  color: var(--muted);
  margin-top: 5px;
}

.board-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 24px;
}

.board-head h2 { margin: 0; }

.board-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}

.filter-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.filter-row button {
  font-size: 13px;
  padding: 9px 12px;
}

.line-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.line-button {
  background: var(--panel2);
  color: var(--text);
  padding: 8px 11px;
  font-size: 12px;
  border-radius: 8px;
}

.filter-caption {
  color: var(--muted);
  font-size: 11px;
  margin-top: 15px;
  margin-bottom: 7px;
}

.departures {
  margin-top: 12px;
  display: grid;
  gap: 12px;
}

.direction {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.direction-title {
  padding: 14px;
  background: var(--panel2);
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.direction-title small {
  color: var(--muted);
  font-weight: normal;
  white-space: nowrap;
}

.departure {
  padding: 13px 14px;
  display: grid;
  grid-template-columns: 65px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border-top: 1px solid var(--border);
}

.line {
  background: #dbeafe;
  color: #10233d;
  border-radius: 7px;
  padding: 6px 5px;
  text-align: center;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.time {
  font-size: 19px;
  font-weight: bold;
}

.destination {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

.platform {
  font-size: 12px;
  color: var(--muted);
  text-align: right;
  white-space: nowrap;
}

.delay {
  color: var(--red);
  font-size: 12px;
  font-weight: bold;
  margin-top: 4px;
}

.on-time {
  color: var(--green);
  font-size: 12px;
  margin-top: 4px;
}

.early {
  color: var(--orange);
  font-size: 12px;
  margin-top: 4px;
}

.cancelled {
  color: var(--red);
  font-size: 12px;
  font-weight: bold;
  margin-top: 4px;
}

.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin-top: 18px;
}

.message {
  color: var(--muted);
  text-align: center;
  padding: 24px 10px;
  line-height: 1.5;
}

.error { color: var(--red); }

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin-top: 28px;
  line-height: 1.6;
}

@media (max-width: 420px) {
  .app { padding: 16px 12px calc(30px + env(safe-area-inset-bottom)); }
  .departure { grid-template-columns: 55px minmax(0, 1fr) auto; }
  .time { font-size: 17px; }
  .platform { font-size: 11px; }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">Wuppertal <span>Verkehr</span></div>
  <div class="status" id="status">Готово</div>
</header>

<h2>Найти остановку</h2>

<div class="search">
  <input
    id="searchInput"
    placeholder="Например, Wuppertal Hbf"
    autocomplete="off"
    maxlength="60"
  >
  <button id="searchButton">Найти</button>
</div>

<div class="controls">
  <button class="active" id="busFilter">Автобусы</button>
  <button class="secondary" id="allFilter">Весь транспорт</button>
</div>

<div id="searchResults" class="results"></div>

<div class="board-head">
  <h2 id="selectedStop">Отправления</h2>
  <div class="board-tools">
    <button class="secondary" id="refreshButton" aria-label="Обновить">↻</button>
  </div>
</div>

<div class="filter-row">
  <button class="secondary" id="delayedFilter">Только задержанные</button>
  <button class="secondary" id="allLinesFilter">Все маршруты</button>
</div>

<div class="filter-caption" id="lineCaption" hidden>ФИЛЬТР ПО МАРШРУТУ</div>
<div class="line-filters" id="lineFilters"></div>

<div id="board" class="departures">
  <div class="message">
    Найди остановку, чтобы увидеть отправления.
  </div>
</div>

<div class="pagination" id="pagination" hidden>
  <button class="secondary" id="prevButton">Назад</button>
  <span id="pageLabel">1 / 1</span>
  <button class="secondary" id="nextButton">Далее</button>
</div>

<div class="footer">
  Данные: VRR OpenService<br>
  Автоматическое обновление каждые 30 секунд
</div>

</div>

<script>
"use strict";

// =====================================================
// CONFIGURATION
// =====================================================

const API_BASE = "https://wuppertal-vrr-api.isychev10.workers.dev/";

const CITY_NAME = "Wuppertal";
const CITY_ID_PREFIX = "de:05124:";

const PAGE_SIZE = 10;
const DEPARTURES_PER_DIRECTION = 4;
const DEPARTURES_PER_DIRECTION_WITH_LINE = 6;
const MAX_LINE_BUTTONS = 20;

const REFRESH_INTERVAL = 30000;
const REQUEST_TIMEOUT = 20000;
const CACHE_TTL = 15000;

const BUS_CLASSES = new Set([5, 6, 7]);

const $ = id => document.getElementById(id);

// =====================================================
// TELEGRAM MINI APP
// =====================================================

const tg = window.Telegram?.WebApp || null;

if (tg) {
  tg.ready();
  tg.expand();

  try {
    tg.setHeaderColor("#101827");
    tg.setBackgroundColor("#101827");
  } catch (error) {
    console.warn("Telegram theme setup:", error);
  }
}

// =====================================================
// APPLICATION STATE
// =====================================================

let selectedStop = null;
let stopGroups = [];
let allDepartures = [];
let directionGroups = [];

let currentPage = 0;
let transportFilter = "bus";
let onlyDelayed = false;
let selectedLine = null;

let refreshTimer = null;
let loading = false;
let searchSequence = 0;

const departureCache = new Map();

// =====================================================
// API HELPERS
// =====================================================

async function apiRequest(endpoint, params) {
  const url = new URL(endpoint, API_BASE);

  Object.entries(params).forEach(([key, value]) => {
    if (value !== undefined && value !== null) {
      url.searchParams.set(key, String(value));
    }
  });

  const controller = new AbortController();
  const timeout = setTimeout(
    () => controller.abort(),
    REQUEST_TIMEOUT
  );

  try {
    const response = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" },
      signal: controller.signal
    });

    if (!response.ok) {
      throw new Error("VRR HTTP " + response.status);
    }

    const text = await response.text();

    try {
      return JSON.parse(text);
    } catch {
      throw new Error("VRR вернул некорректный JSON.");
    }

  } finally {
    clearTimeout(timeout);
  }
}

// =====================================================
// NORMALIZATION
// =====================================================

function normalizeName(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

function getStopId(location) {
  const candidates = [
    location?.id,
    location?.statID,
    location?.stateless,
    location?.ref?.id,
    location?.point?.id,
    location?.properties?.id
  ];

  for (const candidate of candidates) {
    if (candidate !== undefined && candidate !== null && String(candidate).trim()) {
      return String(candidate).trim();
    }
  }

  return null;
}

function getStopName(location) {
  return (
    location?.name ||
    location?.disassembledName ||
    location?.object?.name ||
    location?.point?.name ||
    location?.properties?.name ||
    ""
  ).toString().trim();
}

// =====================================================
// STOP SEARCH
// =====================================================

async function searchStops() {
  const rawQuery = $("searchInput").value.trim();

  if (rawQuery.length < 2) {
    showMessage("Введи хотя бы две буквы.");
    return;
  }

  const sequence = ++searchSequence;

  const query = rawQuery.length > 60
    ? rawQuery.slice(0, 60)
    : rawQuery;

  const fullQuery = normalizeName(query).includes("wuppertal")
    ? query
    : CITY_NAME + ", " + query;

  $("searchButton").disabled = true;
  $("searchResults").innerHTML = "";
  setStatus("Поиск...");

  try {
    const data = await apiRequest(
      "XML_STOPFINDER_REQUEST",
      {
        outputFormat: "rapidJSON",
        locationServerActive: "1",
        type_sf: "stop",
        name_sf: fullQuery,
        anyObjFilter_sf: "2"
      }
    );

    if (sequence !== searchSequence) return;

    const locations = extractLocations(data);
    stopGroups = mergeStops(locations);

    if (!stopGroups.length) {
      showMessage("Остановки в Вуппертале не найдены.");
      setStatus("Готово");
      return;
    }

    renderStopResults();
    setStatus("Найдено: " + stopGroups.length);

  } catch (error) {
    if (sequence !== searchSequence) return;

    console.error("StopFinder error:", error);

    showMessage(
      "Не удалось выполнить поиск. " + explainError(error),
      true
    );

    setStatus("Ошибка");

  } finally {
    if (sequence === searchSequence) {
      $("searchButton").disabled = false;
    }
  }
}

function extractLocations(data) {
  const result = [];
  const seenArrays = new Set();

  function addArray(array) {
    if (!Array.isArray(array) || seenArrays.has(array)) return;

    seenArrays.add(array);

    for (const item of array) {
      if (item && typeof item === "object") {
        result.push(item);
      }
    }
  }

  addArray(data?.locations);
  addArray(data?.stopFinder?.points);
  addArray(data?.points);
  addArray(data?.assignedStops);

  if (data?.stopFinder?.assignedStops) {
    addArray(data.stopFinder.assignedStops);
  }

  if (data?.stopFinder?.locations) {
    addArray(data.stopFinder.locations);
  }

  return result;
}

function isWuppertalStop(location, id, name) {
  const lowerName = normalizeName(name);

  return (
    String(id).startsWith(CITY_ID_PREFIX) ||
    lowerName.includes("wuppertal") ||
    location?.city?.name?.toLowerCase() === "wuppertal"
  );
}

function mergeStops(locations) {
  const groups = new Map();

  for (const location of locations) {
    const id = getStopId(location);
    const name = getStopName(location);

    if (!id || !name) continue;
    if (!isWuppertalStop(location, id, name)) continue;

    const key = normalizeName(name);

    if (!groups.has(key)) {
      groups.set(key, {
        name,
        ids: [],
        type: location.type || "stop"
      });
    }

    const group = groups.get(key);

    if (!group.ids.includes(id)) {
      group.ids.push(id);
    }
  }

  return [...groups.values()]
    .sort((a, b) => a.name.localeCompare(b.name, "de"))
    .slice(0, 10);
}

function renderStopResults() {
  const container = $("searchResults");
  container.innerHTML = "";

  stopGroups.forEach((stop, index) => {
    const button = document.createElement("button");
    button.className = "stop-option";

    const name = document.createElement("strong");
    name.textContent = stop.name;

    const details = document.createElement("small");
    details.textContent =
      stop.ids.length + " идентификатор(а) остановки";

    button.append(name, details);

    button.addEventListener("click", () => {
      selectStop(index);
    });

    container.appendChild(button);
  });
}

// =====================================================
// SELECT STOP
// =====================================================

async function selectStop(index) {
  const stop = stopGroups[index];

  if (!stop) return;

  selectedStop = stop;
  currentPage = 0;
  selectedLine = null;
  onlyDelayed = false;

  $("selectedStop").textContent = stop.name;
  $("searchResults").innerHTML = "";

  updateFilterButtons();
  renderLineFilters();

  stop.ids.forEach(id => {
    if (!departureCache.has(id)) {
      departureCache.delete(id);
    }
  });

  await refreshDepartures();
  startAutoRefresh();
}

// =====================================================
// DEPARTURE REQUESTS
// =====================================================

async function fetchStopEvents(stationId) {
  const cached = departureCache.get(stationId);

  if (cached && Date.now() - cached.timestamp < CACHE_TTL) {
    return cached.data;
  }

  const data = await apiRequest(
    "XML_DM_REQUEST",
    {
      outputFormat: "rapidJSON",
      stateless: "1",
      type_dm: "any",
      name_dm: stationId,
      mode: "direct",
      useProxFootSearch: "0",
      useRealtime: "1",
      limit: "80"
    }
  );

  departureCache.set(stationId, {
    timestamp: Date.now(),
    data
  });

  return data;
}

async function refreshDepartures() {
  if (!selectedStop || loading) return;

  loading = true;
  setStatus("Обновление...");
  $("refreshButton").disabled = true;

  const stopAtRequestStart = selectedStop;

  try {
    const requests = stopAtRequestStart.ids.map(async id => {
      try {
        return await fetchStopEvents(id);
      } catch (error) {
        console.error("Departure request failed:", id, error);
        return null;
      }
    });

    const responses = await Promise.all(requests);

    if (selectedStop !== stopAtRequestStart) return;

    const successfulResponses = responses.filter(Boolean);

    if (!successfulResponses.length) {
      throw new Error("Не удалось получить данные ни с одного ID остановки.");
    }

    let rawDepartures = [];

    for (const response of successfulResponses) {
      rawDepartures.push(...extractDepartures(response));
    }

    allDepartures = deduplicateDepartures(rawDepartures)
      .filter(isFutureDeparture)
      .sort((a, b) => a.timestamp - b.timestamp);

    buildDirectionGroups();

    const totalPages = Math.ceil(directionGroups.length / PAGE_SIZE);

    currentPage = Math.min(
      currentPage,
      Math.max(0, totalPages - 1)
    );

    renderLineFilters();
    renderBoard();

    const time = new Date().toLocaleTimeString("de-DE", {
      hour: "2-digit",
      minute: "2-digit"
    });

    setStatus(
      "Обновлено " + time +
      (successfulResponses.length < stopAtRequestStart.ids.length
        ? " · частично"
        : "")
    );

  } catch (error) {
    console.error("Departure error:", error);

    showMessage(
      "Не удалось получить отправления. " + explainError(error),
      true
    );

    setStatus("Ошибка");

  } finally {
    loading = false;
    $("refreshButton").disabled = false;
  }
}

function extractDepartures(data) {
  const result = [];

  if (Array.isArray(data?.departureList)) {
    result.push(...data.departureList);
  }

  if (Array.isArray(data?.stopEvents)) {
    result.push(...data.stopEvents);
  }

  if (Array.isArray(data?.departures)) {
    result.push(...data.departures);
  }

  return result;
}

// =====================================================
// DATE PARSING
// =====================================================

function parseDate(value) {
  if (!value) return null;

  if (value instanceof Date) {
    return Number.isNaN(value.getTime()) ? null : value;
  }

  if (typeof value === "number") {
    const date = new Date(value < 1000000000000 ? value * 1000 : value);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  if (typeof value === "string") {
    const trimmed = value.trim();

    if (!trimmed) return null;

    const date = new Date(trimmed);

    if (!Number.isNaN(date.getTime())) {
      return date;
    }

    const match = trimmed.match(
      /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );

    if (match) {
      return new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3]),
        Number(match[4]),
        Number(match[5]),
        Number(match[6] || 0)
      );
    }

    return null;
  }

  if (typeof value === "object") {
    const year = Number(value.year);
    const month = Number(value.month);
    const day = Number(value.day);
    const hour = Number(value.hour);
    const minute = Number(value.minute);
    const second = Number(value.second || 0);

    if (
      Number.isFinite(year) &&
      Number.isFinite(month) &&
      Number.isFinite(day) &&
      Number.isFinite(hour) &&
      Number.isFinite(minute)
    ) {
      return new Date(year, month - 1, day, hour, minute, second);
    }

    if (value.timestamp) {
      return parseDate(value.timestamp);
    }

    if (value.dateTime) {
      return parseDate(value.dateTime);
    }
  }

  return null;
}

// =====================================================
// DEPARTURE PARSING
// =====================================================

function getProductText(transport, servingLine) {
  const product = transport?.product || servingLine?.product;

  if (typeof product === "string" || typeof product === "number") {
    return String(product);
  }

  return String(
    product?.name ||
    product?.description ||
    product?.shortName ||
    ""
  );
}

function getProductClass(transport, servingLine) {
  const product = transport?.product || servingLine?.product;

  const candidates = [
    product?.class,
    product?.motType,
    servingLine?.motType,
    transport?.motType
  ];

  for (const value of candidates) {
    const number = Number(value);

    if (Number.isFinite(number)) {
      return number;
    }
  }

  return null;
}

function isCancelledItem(item) {
  const candidates = [
    item?.isCancelled,
    item?.cancelled,
    item?.isCanceled,
    item?.canceled,
    item?.cancelledTrip,
    item?.realtimeStatus
  ];

  for (const value of candidates) {
    if (value === true || value === 1) return true;

    if (typeof value === "string") {
      const normalized = value.toLowerCase();

      if (
        normalized.includes("cancel") ||
        normalized.includes("ausfall") ||
        normalized === "true"
      ) {
        return true;
      }
    }
  }

  return false;
}

function parseDeparture(item) {
  const transport = item?.transportation || {};
  const servingLine = item?.servingLine || {};

  const planned =
    parseDate(item?.departureTimePlanned) ||
    parseDate(item?.dateTime) ||
    parseDate(item?.departureTime) ||
    parseDate(item?.plannedDateTime);

  if (!planned) return null;

  const estimated =
    parseDate(item?.departureTimeEstimated) ||
    parseDate(item?.realDateTime) ||
    parseDate(item?.estimatedDateTime) ||
    planned;

  const destinationValue =
    transport?.destination?.name ||
    transport?.destination ||
    servingLine?.direction ||
    item?.direction ||
    item?.destination?.name ||
    item?.destination ||
    "Направление не указано";

  const number =
    servingLine?.number ||
    transport?.number ||
    transport?.disassembledName ||
    servingLine?.name ||
    transport?.name ||
    "?";

  const platform =
    item?.location?.properties?.platformName ||
    item?.platformName ||
    item?.platform?.name ||
    item?.platform ||
    item?.stop?.platformName ||
    "";

  const delay = Math.round(
    (estimated.getTime() - planned.getTime()) / 60000
  );

  const productText = getProductText(transport, servingLine);
  const productClass = getProductClass(transport, servingLine);

  return {
    line: String(number).trim(),
    destination: String(destinationValue).trim(),
    platform: typeof platform === "object"
      ? String(platform.name || platform.number || "")
      : String(platform),
    product: productText,
    productClass,
    planned,
    estimated,
    timestamp: estimated.getTime(),
    plannedTimestamp: planned.getTime(),
    delay,
    cancelled: isCancelledItem(item),
    isBus: null
  };
}

function classifyBus(departure) {
  if (BUS_CLASSES.has(departure.productClass)) {
    return true;
  }

  if (departure.productClass !== null) {
    return false;
  }

  const product = normalizeName(departure.product);

  if (/bus|busse|expressbus|nachtbus/.test(product)) {
    return true;
  }

  if (product) {
    return false;
  }

  // Если VRR не сообщил тип транспорта, не угадываем его.
  return false;
}

function isFutureDeparture(item) {
  return item.timestamp >= Date.now() - 60000;
}

function deduplicateDepartures(items) {
  const unique = new Map();

  for (const raw of items) {
    const item = parseDeparture(raw);

    if (!item) continue;

    item.isBus = classifyBus(item);

    const key = [
      item.line,
      normalizeName(item.destination),
      item.platform,
      item.plannedTimestamp,
      item.timestamp,
      item.cancelled
    ].join("|");

    if (!unique.has(key)) {
      unique.set(key, item);
    } else {
      // Если один из дублей содержит платформу, сохраняем её.
      const existing = unique.get(key);

      if (!existing.platform && item.platform) {
        existing.platform = item.platform;
      }
    }
  }

  return [...unique.values()];
}

// =====================================================
// FILTERING AND GROUPING
// =====================================================

function getFilteredDepartures() {
  let result = [...allDepartures];

  if (transportFilter === "bus") {
    result = result.filter(item => item.isBus);
  }

  if (onlyDelayed) {
    result = result.filter(item => item.cancelled || item.delay >= 3);
  }

  if (selectedLine) {
    result = result.filter(item => item.line === selectedLine);
  }

  return result.sort((a, b) => a.timestamp - b.timestamp);
}

function buildDirectionGroups() {
  const departures = getFilteredDepartures();
  const groups = new Map();

  for (const departure of departures) {
    const key = normalizeName(departure.destination);

    if (!groups.has(key)) {
      groups.set(key, {
        destination: departure.destination,
        departures: []
      });
    }

    groups.get(key).departures.push(departure);
  }

  const perDirection = selectedLine
    ? DEPARTURES_PER_DIRECTION_WITH_LINE
    : DEPARTURES_PER_DIRECTION;

  directionGroups = [...groups.values()]
    .map(group => ({
      ...group,
      departures: group.departures
        .sort((a, b) => a.timestamp - b.timestamp)
        .slice(0, perDirection)
    }))
    .sort((a, b) => {
      const timeA = a.departures[0]?.timestamp || Infinity;
      const timeB = b.departures[0]?.timestamp || Infinity;

      return timeA - timeB;
    });
}

// =====================================================
// LINE FILTER BUTTONS
// =====================================================

function renderLineFilters() {
  const container = $("lineFilters");
  const caption = $("lineCaption");

  container.innerHTML = "";

  const departures = allDepartures.filter(item => {
    return transportFilter === "all" || item.isBus;
  });

  const lines = [...new Set(
    departures.map(item => item.line).filter(Boolean)
  )].sort((a, b) => a.localeCompare(b, "de", {
    numeric: true
  }));

  caption.hidden = lines.length === 0;

  const visibleLines = lines.slice(0, MAX_LINE_BUTTONS);

  visibleLines.forEach(lineNumber => {
    const button = document.createElement("button");
    button.className = "line-button";

    if (selectedLine === lineNumber) {
      button.classList.add("active");
    }

    button.textContent = lineNumber;

    button.addEventListener("click", () => {
      selectedLine = selectedLine === lineNumber
        ? null
        : lineNumber;

      currentPage = 0;
      updateFilterButtons();
      renderLineFilters();
      buildDirectionGroups();
      renderBoard();
    });

    container.appendChild(button);
  });
}

function updateFilterButtons() {
  $("busFilter").className =
    transportFilter === "bus" ? "active" : "secondary";

  $("allFilter").className =
    transportFilter === "all" ? "active" : "secondary";

  $("delayedFilter").className =
    onlyDelayed ? "active" : "secondary";

  $("allLinesFilter").className =
    selectedLine ? "active" : "secondary";

  $("allLinesFilter").textContent =
    selectedLine ? "Маршрут " + selectedLine + " ×" : "Все маршруты";
}

// =====================================================
// RENDER BOARD
// =====================================================

function renderBoard() {
  const container = $("board");
  container.innerHTML = "";

  if (!directionGroups.length) {
    showMessage(
      onlyDelayed
        ? "Задержанных отправлений от 3 минут или отменённых рейсов нет."
        : "На ближайшее время отправлений не найдено."
    );

    $("pagination").hidden = true;
    return;
  }

  const totalPages = Math.ceil(
    directionGroups.length / PAGE_SIZE
  );

  currentPage = Math.min(currentPage, totalPages - 1);

  const start = currentPage * PAGE_SIZE;

  const pageGroups = directionGroups.slice(
    start,
    start + PAGE_SIZE
  );

  pageGroups.forEach(group => {
    const card = document.createElement("div");
    card.className = "direction";

    const title = document.createElement("div");
    title.className = "direction-title";

    const destination = document.createElement("span");
    destination.textContent = group.destination;

    const count = document.createElement("small");
    count.textContent = group.departures.length + " отправ.";

    title.append(destination, count);
    card.appendChild(title);

    group.departures.forEach(dep => {
      const row = document.createElement("div");
      row.className = "departure";

      const line = document.createElement("div");
      line.className = "line";
      line.textContent = dep.line;

      const info = document.createElement("div");

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = formatTime(dep.estimated);

      const detail = document.createElement("div");
      detail.className = "destination";
      detail.textContent =
        "План: " + formatTime(dep.planned);

      const status = document.createElement("div");

      if (dep.cancelled) {
        status.className = "cancelled";
        status.textContent = "Отменён";
      } else if (dep.delay >= 1) {
        status.className = "delay";
        status.textContent = "+" + dep.delay + " мин. задержка";
      } else if (dep.delay <= -1) {
        status.className = "early";
        status.textContent = Math.abs(dep.delay) + " мин. раньше";
      } else {
        status.className = "on-time";
        status.textContent = "По расписанию";
      }

      info.append(time, detail, status);

      const platform = document.createElement("div");
      platform.className = "platform";
      platform.textContent = dep.platform
        ? "Платф. " + dep.platform
        : "";

      row.append(line, info, platform);
      card.appendChild(row);
    });

    container.appendChild(card);
  });

  $("pagination").hidden = totalPages <= 1;

  $("pageLabel").textContent =
    (currentPage + 1) + " / " + totalPages;

  $("prevButton").disabled = currentPage === 0;
  $("nextButton").disabled = currentPage >= totalPages - 1;
}

function formatTime(date) {
  return date.toLocaleTimeString("de-DE", {
    hour: "2-digit",
    minute: "2-digit",
    timeZone: "Europe/Berlin"
  });
}

// =====================================================
// FILTERS
// =====================================================

$("busFilter").addEventListener("click", () => {
  transportFilter = "bus";
  selectedLine = null;
  currentPage = 0;

  updateFilterButtons();
  renderLineFilters();
  buildDirectionGroups();
  renderBoard();
});

$("allFilter").addEventListener("click", () => {
  transportFilter = "all";
  selectedLine = null;
  currentPage = 0;

  updateFilterButtons();
  renderLineFilters();
  buildDirectionGroups();
  renderBoard();
});

$("delayedFilter").addEventListener("click", () => {
  onlyDelayed = !onlyDelayed;
  currentPage = 0;

  updateFilterButtons();
  buildDirectionGroups();
  renderBoard();
});

$("allLinesFilter").addEventListener("click", () => {
  selectedLine = null;
  currentPage = 0;

  updateFilterButtons();
  renderLineFilters();
  buildDirectionGroups();
  renderBoard();
});

// =====================================================
// PAGINATION
// =====================================================

$("prevButton").addEventListener("click", () => {
  if (currentPage > 0) {
    currentPage--;
    renderBoard();
  }
});

$("nextButton").addEventListener("click", () => {
  const pages = Math.ceil(directionGroups.length / PAGE_SIZE);

  if (currentPage < pages - 1) {
    currentPage++;
    renderBoard();
  }
});

// =====================================================
// EVENTS
// =====================================================

$("searchButton").addEventListener("click", searchStops);

$("searchInput").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    searchStops();
  }
});

$("refreshButton").addEventListener("click", () => {
  // Принудительное обновление: сбрасываем кэш выбранной остановки.
  if (selectedStop) {
    selectedStop.ids.forEach(id => departureCache.delete(id));
  }

  refreshDepartures();
});

// =====================================================
// AUTO REFRESH
// =====================================================

function startAutoRefresh() {
  stopAutoRefresh();

  refreshTimer = setInterval(() => {
    if (selectedStop && !document.hidden && !loading) {
      refreshDepartures();
    }
  }, REFRESH_INTERVAL);
}

function stopAutoRefresh() {
  if (refreshTimer) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && selectedStop && !loading) {
    selectedStop.ids.forEach(id => departureCache.delete(id));
    refreshDepartures();
  }
});

// =====================================================
// UI HELPERS
// =====================================================

function setStatus(text) {
  $("status").textContent = text;
}

function showMessage(text, error = false) {
  const board = $("board");
  board.innerHTML = "";

  const message = document.createElement("div");
  message.className = error ? "message error" : "message";
  message.textContent = text;

  board.appendChild(message);
}

function explainError(error) {
  if (error?.name === "AbortError") {
    return "Превышено время ожидания.";
  }

  if (error instanceof TypeError) {
    return "Ошибка сетевого соединения или CORS.";
  }

  return error?.message || "Неизвестная ошибка.";
}

// =====================================================
// START
// =====================================================

updateFilterButtons();

console.log("Wuppertal Verkehr started.");
console.log("VRR API:", API_BASE);
console.log("Telegram Mini App:", Boolean(tg));

</script>
