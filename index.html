<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="color-scheme" content="dark">
<title>Wuppertal Verkehr</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --bg: #101827;
  --panel: #1b2738;
  --panel2: #243348;
  --text: #f4f7fb;
  --muted: #a6b3c5;
  --accent: #58a6ff;
  --green: #39d98a;
  --red: #ff7373;
  --orange: #ffbd69;
  --border: #34445a;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

/* Without this, rules like ".pagination { display: flex }" override the
   `hidden` attribute and "hidden" elements stay visible. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; }

.app {
  max-width: 760px;
  margin: auto;
  padding: 20px 15px calc(40px + env(safe-area-inset-bottom));
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 22px;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  padding-top: 3px;
}

.logo span { color: var(--accent); }

.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;
}

.status {
  color: var(--muted);
  font-size: 12px;
  text-align: right;
  min-height: 15px;
}

/* ---------- language switch ---------- */

.lang-switch {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.lang-switch button {
  background: transparent;
  color: var(--muted);
  border-radius: 0;
  padding: 6px 11px;
  font-size: 12px;
  letter-spacing: .5px;
}

.lang-switch button.active {
  background: var(--accent);
  color: #081321;
}

h2 {
  font-size: 17px;
  margin: 20px 0 12px;
}

.search {
  display: flex;
  gap: 8px;
}

input:not([type="checkbox"]) {
  min-width: 0;
  flex: 1;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--text);
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: var(--accent);
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  background: var(--accent);
  color: #081321;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
.departure:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button:disabled {
  opacity: .4;
  cursor: default;
}

.secondary {
  background: var(--panel2);
  color: var(--text);
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.controls button.active,
.line-button.active {
  background: var(--accent);
  color: #081321;
}

.results {
  margin-top: 12px;
  display: grid;
  gap: 8px;
}

.stop-option {
  width: 100%;
  text-align: left;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 12px;
}

.stop-option small {
  display: block;
  color: var(--muted);
  font-weight: normal;
  margin-top: 5px;
}

.search-message {
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
}

.search-message.error { color: var(--red); }

/* ---------- recent stops ---------- */

.recent { margin-top: 4px; }

.recent-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 10px;
}

.link-button {
  background: transparent;
  color: var(--muted);
  padding: 6px 2px;
  margin-bottom: 1px;
  font-size: 11px;
  font-weight: normal;
  text-decoration: underline;
}

.recent-list {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.chip {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 13px;
  font-size: 13px;
  font-weight: normal;
}

/* ---------- board ---------- */

.board-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 24px;
}

.board-head h2 { margin: 0; overflow-wrap: anywhere; }

.board-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}

#refreshButton.spinning { animation: spin 1s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

.filter-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.filter-row button {
  font-size: 13px;
  padding: 9px 12px;
}

.line-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.line-button {
  background: var(--panel2);
  color: var(--text);
  padding: 8px 11px;
  font-size: 12px;
  border-radius: 8px;
}

.filter-caption {
  color: var(--muted);
  font-size: 11px;
  margin-top: 15px;
  margin-bottom: 7px;
}

.summary {
  margin-top: 14px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
}

.summary .ok { color: var(--green); }
.summary .late { color: var(--orange); }
.summary .bad { color: var(--red); }

.departures {
  margin-top: 12px;
  display: grid;
  gap: 12px;
}

.direction {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.direction-title {
  padding: 14px;
  background: var(--panel2);
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.direction-title small {
  color: var(--muted);
  font-weight: normal;
  text-align: right;
}

.departure {
  padding: 13px 14px;
  display: grid;
  grid-template-columns: 65px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border-top: 1px solid var(--border);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.departure:hover,
.departure[aria-expanded="true"] {
  background: rgba(88, 166, 255, .07);
}

.line {
  background: #dbeafe;
  color: #10233d;
  border-radius: 7px;
  padding: 6px 5px;
  text-align: center;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.time-row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 9px;
}

.time {
  font-size: 19px;
  font-weight: bold;
}

.time.struck {
  text-decoration: line-through;
  color: var(--muted);
}

.eta {
  font-size: 12px;
  font-weight: bold;
  color: var(--accent);
}

.destination {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

.delay,
.delay-minor,
.on-time,
.early,
.cancelled,
.no-rt {
  font-size: 12px;
  margin-top: 4px;
}

.delay { color: var(--red); font-weight: bold; }
.delay-minor { color: var(--orange); font-weight: bold; }
.on-time { color: var(--green); }
.early { color: var(--orange); }
.cancelled { color: var(--red); font-weight: bold; }
.no-rt { color: var(--muted); }

.chev {
  color: var(--muted);
  font-size: 13px;
  transition: transform .15s;
  text-align: right;
}

.departure[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* ---------- stop sequence of a trip ---------- */

.stops-panel {
  padding: 4px 14px 16px;
  background: rgba(0, 0, 0, .14);
  border-top: 1px dashed var(--border);
}

.stops-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
  font-size: 13px;
  font-weight: bold;
}

.stops-title small {
  color: var(--muted);
  font-weight: normal;
}

.stops-note {
  margin-top: 12px;
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}

.stops-note.error { color: var(--red); }

.stops-note button {
  padding: 7px 11px;
  font-size: 12px;
}

.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  flex: none;
}

.stop-list {
  list-style: none;
  margin: 12px 0 0 7px;
  padding: 0;
  border-left: 2px solid var(--accent);
}

.stop-list li {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 7px 0 7px 16px;
  font-size: 14px;
}

.stop-list li::before {
  content: "";
  position: absolute;
  left: -7px;
  top: 50%;
  width: 12px;
  height: 12px;
  margin-top: -6px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--accent);
}

.stop-list li.here::before,
.stop-list li.end::before {
  background: var(--accent);
}

.stop-name {
  min-width: 0;
  overflow-wrap: anywhere;
}

.stop-name small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}

.stop-time {
  white-space: nowrap;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

.stop-time small {
  margin-left: 6px;
  font-size: 11px;
}

.stop-time .late { color: var(--orange); }
.stop-time .bad { color: var(--red); }

.stops-toggle {
  margin-top: 10px;
  padding: 8px 12px;
  font-size: 12px;
}

/* ---------- misc ---------- */

.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin-top: 18px;
}

.message {
  color: var(--muted);
  text-align: center;
  padding: 24px 10px;
  line-height: 1.5;
}

.message button { margin-top: 12px; }

.error { color: var(--red); }

.data-note {
  margin-top: 14px;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  line-height: 1.6;
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin-top: 28px;
  line-height: 1.6;
}

@media (max-width: 420px) {
  .app { padding: 16px 12px calc(30px + env(safe-area-inset-bottom)); }
  .departure { grid-template-columns: 55px minmax(0, 1fr) auto; }
  .time { font-size: 17px; }
}

@media (prefers-reduced-motion: reduce) {
  .spinner, #refreshButton.spinning { animation-duration: 3s; }
  .chev { transition: none; }
}

/* ---------- header tools / about button ---------- */

.header-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-button {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px 10px;
  font-size: 15px;
  line-height: 1.5;
}

.icon-button:hover { color: var(--text); }

/* ---------- grouping switch ---------- */

.group-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 10px;
  margin-top: 16px;
}

.group-label {
  color: var(--muted);
  font-size: 12px;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.seg button {
  background: transparent;
  color: var(--muted);
  border-radius: 0;
  padding: 8px 13px;
  font-size: 12px;
}

.seg button.active {
  background: var(--accent);
  color: #081321;
}

/* ---------- direction / platform / line cards ---------- */

.dt-main { min-width: 0; }

.dt-title { overflow-wrap: anywhere; }

.dt-sub {
  margin-top: 4px;
  font-size: 12px;
  font-weight: normal;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.line-sb {
  background: #fde68a;
  color: #3b2f00;
}

.more-button {
  width: 100%;
  border-radius: 0;
  border-top: 1px solid var(--border);
  padding: 11px;
  font-size: 12px;
}

/* ---------- bottom sheet ---------- */

body.no-scroll { overflow: hidden; }

.sheet {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(5, 10, 20, .72);
}

.sheet-card {
  width: min(620px, 100%);
  max-height: 90vh;
  max-height: 90dvh;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px 18px 0 0;
  padding: 0 18px calc(22px + env(safe-area-inset-bottom));
}

@media (min-width: 640px) {
  .sheet { align-items: center; }
  .sheet-card { border-radius: 18px; }
}

.sheet-head {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 16px 0 10px;
  background: var(--panel);
}

.sheet-head h3 {
  margin: 0;
  font-size: 17px;
}

.sheet-body {
  font-size: 14px;
  line-height: 1.55;
}

.sheet-body h4 {
  margin: 18px 0 6px;
  font-size: 13px;
  color: var(--accent);
}

.sheet-body p {
  margin: 0 0 10px;
  overflow-wrap: anywhere;
}

.sheet-lead { font-size: 15px; }

.muted { color: var(--muted); }

.about-data { margin-top: 16px; }

.provider {
  white-space: pre-line;
  background: var(--panel2);
  border-radius: 10px;
  padding: 10px 12px;
}

.legal-note {
  color: var(--muted);
  font-size: 12px;
}

.about-brand {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.about-brand strong { font-size: 20px; }

.about-card {
  background: var(--panel2);
  border-radius: 14px;
  padding: 14px;
  margin: 14px 0;
}

.about-handle {
  display: block;
  margin: 4px 0 12px;
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
  text-decoration: none;
  overflow-wrap: anywhere;
}

.about-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn-link {
  display: inline-block;
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--accent);
  color: #081321;
  font-size: 13px;
  font-weight: bold;
  text-decoration: none;
}

.btn-link.outline {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}

.sheet-links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  margin-top: 16px;
}

.switch {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 14px 0;
  font-size: 14px;
}

.switch input {
  flex: none;
  width: 20px;
  height: 20px;
  margin: 2px 0 0;
  accent-color: var(--accent);
}

.switch small {
  display: block;
  margin-top: 3px;
  font-size: 12px;
  color: var(--muted);
}

/* ---------- footer credit ---------- */

.footer-credit { margin-top: 12px; }

.footer-credit a {
  color: var(--accent);
  font-weight: bold;
  text-decoration: none;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 2px 8px;
  margin-top: 6px;
}

.footer-links .link-button { padding: 4px 2px; }
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">Wuppertal <span>Verkehr</span></div>

  <div class="header-right">
    <div class="header-tools">
      <div class="lang-switch" id="langSwitch" role="group" data-i18n-aria="langLabel">
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
      <button type="button" class="icon-button" id="aboutButton" data-i18n-aria="aboutOpen">ⓘ</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
</header>

<h2 data-i18n="searchTitle"></h2>

<div class="search">
  <input
    id="searchInput"
    data-i18n-placeholder="searchPlaceholder"
    autocomplete="off"
    maxlength="60"
  >
  <button id="searchButton" data-i18n="searchButton"></button>
</div>

<div class="controls">
  <button class="active" id="busFilter" data-i18n="filterBus"></button>
  <button class="secondary" id="sbFilter" data-i18n="filterSb"></button>
  <button class="secondary" id="allFilter" data-i18n="filterAll"></button>
</div>

<div id="searchResults" class="results"></div>
<div id="searchMessage" class="search-message" hidden></div>

<div class="recent" id="recent" hidden>
  <div class="recent-head">
    <div class="filter-caption" data-i18n="recent"></div>
    <button
      type="button"
      class="link-button"
      id="clearRecent"
      data-i18n="recentClear"
      data-i18n-aria="recentClearAria"
    ></button>
  </div>
  <div class="recent-list" id="recentList"></div>
</div>

<div class="board-head">
  <h2 id="selectedStop"></h2>
  <div class="board-tools">
    <button class="secondary" id="refreshButton" data-i18n-aria="refresh">↻</button>
  </div>
</div>

<div class="filter-row">
  <button class="secondary" id="delayedFilter"></button>
  <button class="secondary" id="allLinesFilter"></button>
</div>

<div class="filter-caption" id="lineCaption" hidden data-i18n="lineCaption"></div>
<div class="line-filters" id="lineFilters"></div>

<div class="group-bar" id="groupBar" hidden>
  <span class="group-label" data-i18n="groupBy"></span>
  <div class="seg" id="groupSwitch" role="group" data-i18n-aria="groupBy">
    <button type="button" data-group="direction" data-i18n="groupDirection"></button>
    <button type="button" data-group="platform" data-i18n="groupPlatform"></button>
    <button type="button" data-group="line" data-i18n="groupLine"></button>
  </div>
</div>

<div class="summary" id="summary" hidden></div>

<div id="board" class="departures"></div>

<div class="data-note" id="dataNote" hidden></div>

<div class="pagination" id="pagination" hidden>
  <button class="secondary" id="prevButton" data-i18n="prev"></button>
  <span id="pageLabel">1 / 1</span>
  <button class="secondary" id="nextButton" data-i18n="next"></button>
</div>

<div class="footer">
  <span data-i18n="footerSource"></span><br>
  <span data-i18n="footerRefresh"></span>

  <div class="footer-credit">
    <span data-i18n="footerBuiltBy"></span>
    <a href="https://t.me/bipolar0c4ka" data-ext="1" target="_blank" rel="noopener noreferrer">@bipolar0c4ka</a>
  </div>

  <div class="footer-links">
    <button type="button" class="link-button" data-sheet="privacy" data-i18n="linkPrivacy"></button>
    <span aria-hidden="true">·</span>
    <button type="button" class="link-button" data-sheet="imprint" data-i18n="linkImprint"></button>
    <span aria-hidden="true">·</span>
    <button type="button" class="link-button" data-sheet="about" data-i18n="linkAbout"></button>
  </div>
</div>

</div>

<!-- Bottom sheet used for "About", "Datenschutz" and "Impressum" -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h3 id="sheetTitle"></h3>
      <button type="button" class="icon-button" id="sheetClose">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
"use strict";

// =====================================================
// CONFIGURATION
// =====================================================

// Cloudflare Worker that proxies the VRR EFA API (adds CORS headers).
// IMPORTANT: it must forward ALL query parameters unchanged, including
// itdDate, itdTime, depType and includeCompleteStopSeq.
const API_BASE = "https://wuppertal-vrr-api.isychev10.workers.dev/";

const CITY_NAME = "Wuppertal";
const CITY_ID_PREFIX = "de:05124:";

const MAX_SEARCH_RESULTS = 10;
const MAX_IDS_PER_STOP = 6;

const PAGE_SIZE = 10;
const DEPARTURES_PER_DIRECTION = 4;
const DEPARTURES_PER_DIRECTION_WITH_LINE = 6;
const MAX_LINE_BUTTONS = 24;
const DELAYED_MIN = 3;          // "only delayed" threshold (minutes)
const MAJOR_DELAY_MIN = 5;      // >= this is shown in red

const EVENTS_LIMIT = 80;        // events per EFA request
const DEEP_HORIZON_MIN = 120;   // how far ahead a selected line is loaded
const DEEP_MAX_PAGES = 5;       // max requests per station in deep mode

const TRIP_EVENTS_LIMIT = 60;   // events requested to find one trip
const TRIP_PREVIEW_COUNT = 8;   // stops shown before "show all"
const TRIP_TTL = 60000;         // stop sequence cache lifetime

const REFRESH_INTERVAL = 30000;
const ETA_TICK_INTERVAL = 20000;
const REQUEST_TIMEOUT = 20000;
const CACHE_TTL = 15000;

function storageGet(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

function storageSet(key, value) {
  try { localStorage.setItem(key, value); } catch { /* ignore */ }
}

function loadGroupMode() {
  const saved = storageGet(STORAGE_GROUP);
  return GROUP_MODES.includes(saved) ? saved : "direction";
}

let lang = (() => {
  const saved = storageGet(STORAGE_LANG);
  return saved === "ru" || saved === "de" ? saved : "de";
})();

function t(key, vars) {
  let text = I18N[lang]?.[key] ?? I18N.de[key] ?? key;

  if (vars) {
    text = text.replace(/\{(\w+)\}/g, (match, name) =>
      vars[name] !== undefined ? String(vars[name]) : match
    );
  }

  return text;
}

function applyStaticTexts() {
  document.documentElement.lang = lang;
  document.title = t("docTitle");

  document.querySelectorAll("[data-i18n]").forEach(node => {
    node.textContent = t(node.dataset.i18n);
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach(node => {
    node.placeholder = t(node.dataset.i18nPlaceholder);
  });

  document.querySelectorAll("[data-i18n-aria]").forEach(node => {
    node.setAttribute("aria-label", t(node.dataset.i18nAria));
  });

  document.querySelectorAll("#langSwitch button").forEach(button => {
    const active = button.dataset.lang === lang;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
}

function setLanguage(newLang) {
  if (newLang === lang || !I18N[newLang]) return;

  lang = newLang;
  storageSet(STORAGE_LANG, lang);
  track("lang", lang);
  haptic();
  renderAll();
}

// =====================================================
// ERRORS
// =====================================================

class AppError extends Error {
  constructor(kind, vars) {
    super(kind);
    this.kind = kind;
    this.vars = vars || {};
  }
}

function explainError(error) {
  if (error?.name === "AbortError") return t("errTimeout");
  if (error instanceof AppError) return t("err_" + error.kind, error.vars);
  if (error instanceof TypeError) return t("errNetwork");
  return error?.message || t("errUnknown");
}

// =====================================================
// API HELPERS
// =====================================================

async function apiRequest(endpoint, params) {
  const url = new URL(endpoint, API_BASE);

  Object.entries(params).forEach(([key, value]) => {
    if (value !== undefined && value !== null) {
      url.searchParams.set(key, String(value));
    }
  });

  // Respect a previous HTTP 429 without sending anything.
  const wait = rateLimitedUntil - Date.now();
  if (wait > 0) throw new AppError("rate", { sec: Math.ceil(wait / 1000) });

  // Identical requests that are already running share one network call.
  const key = url.toString();
  if (inflight.has(key)) return inflight.get(key);

  const promise = requestJson(url).finally(() => inflight.delete(key));
  inflight.set(key, promise);
  return promise;
}

async function requestJson(url) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);

  try {
    const response = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" },
      signal: controller.signal
    });

    if (response.status === 429) {
      const header = Number(response.headers.get("Retry-After"));
      const sec = Number.isFinite(header) && header > 0
        ? Math.min(header, 300)
        : 30;

      rateLimitedUntil = Date.now() + sec * 1000;
      throw new AppError("rate", { sec });
    }

    if (!response.ok) {
      throw new AppError("http", { code: response.status });
    }

    const text = await response.text();

    try {
      return JSON.parse(text);
    } catch {
      throw new AppError("json");
    }

  } finally {
    clearTimeout(timeout);
  }
}

// EFA expects date/time in the local time of the transport region.
function berlinDateTimeParams(ms) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Berlin",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date(ms));

  const get = type => parts.find(part => part.type === type)?.value || "00";

  return {
    itdDate: get("year") + get("month") + get("day"),
    itdTime: get("hour") + get("minute")
  };
}

function dmParams(stationId, startMs, extra) {
  const params = {
    outputFormat: "rapidJSON",
    stateless: "1",
    type_dm: "any",
    name_dm: stationId,
    mode: "direct",
    useProxFootSearch: "0",
    useRealtime: "1",
    limit: String(EVENTS_LIMIT),
    ...extra
  };

  if (startMs !== null && startMs !== undefined) {
    Object.assign(params, berlinDateTimeParams(startMs));
  }

  return params;
}

// =====================================================
// NORMALIZATION
// =====================================================

function normalizeName(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

// 'de:05124:5012:0:2' (a platform) -> 'de:05124:5012' (the whole station),
// so that departures of ALL platforms / both directions are returned.
function toStationId(id) {
  const parts = String(id).split(":");
  return parts[0] === "de" && parts.length > 3
    ? parts.slice(0, 3).join(":")
    : String(id);
}

function getStopId(location) {
  const candidates = [
    location?.id,
    location?.statID,
    location?.stateless,
    location?.ref?.id,
    location?.point?.id,
    location?.properties?.id
  ];

  for (const candidate of candidates) {
    if (candidate !== undefined && candidate !== null && String(candidate).trim()) {
      return String(candidate).trim();
    }
  }

  return null;
}

function getStopName(location) {
  return (
    location?.name ||
    location?.disassembledName ||
    location?.object?.name ||
    location?.point?.name ||
    location?.properties?.name ||
    ""
  ).toString().trim();
}

function shortStopName(name) {
  return String(name).replace(/^Wuppertal,\s*/i, "");
}

// RECENT STOPS
// =====================================================

function persistRecent() {
  storageSet(STORAGE_RECENT, JSON.stringify(recentStops));
}

// Data from localStorage is not trusted: it may be corrupted, edited by hand
// or written by an older version of the app. Only well-formed entries pass.
function isValidRecentEntry(item) {
  return Boolean(
    item &&
    typeof item.name === "string" &&
    item.name.length > 0 &&
    item.name.length <= 120 &&
    Array.isArray(item.ids) &&
    item.ids.length > 0 &&
    item.ids.length <= MAX_IDS_PER_STOP &&
    item.ids.every(id => typeof id === "string" && /^[\w:.-]{1,64}$/.test(id))
  );
}

function loadRecent() {
  try {
    const raw = storageGet(STORAGE_RECENT) || "[]";
    const parsed = JSON.parse(raw);

    if (!Array.isArray(parsed)) return [];

    const now = Date.now();

    const result = parsed
      .filter(isValidRecentEntry)
      .map(item => ({
        name: item.name,
        ids: item.ids,
        // Entries from older versions have no timestamp: their 30 days start
        // now. A timestamp from the future (wrong device clock) is clamped.
        usedAt: Number.isFinite(item.usedAt) ? Math.min(item.usedAt, now) : now
      }))
      .filter(item => now - item.usedAt <= RECENT_TTL_MS)
      .sort((a, b) => b.usedAt - a.usedAt)
      .slice(0, MAX_RECENT);

    // Write the cleaned list back (drops expired / broken entries for good).
    if (JSON.stringify(result) !== raw) {
      storageSet(STORAGE_RECENT, JSON.stringify(result));
    }

    return result;
  } catch {
    return [];
  }
}

// Removes expired entries (the app may stay open for days in the background).
function pruneRecent() {
  const now = Date.now();
  const fresh = recentStops.filter(item => now - item.usedAt <= RECENT_TTL_MS);

  if (fresh.length !== recentStops.length) {
    recentStops = fresh;
    persistRecent();
  }
}

function pushRecent(stop) {
  const key = stopKey(stop.name);

  recentStops = [
    { name: stop.name, ids: stop.ids, usedAt: Date.now() },
    ...recentStops.filter(item => stopKey(item.name) !== key)
  ].slice(0, MAX_RECENT);

  persistRecent();
}

function clearRecent() {
  recentStops = [];
  persistRecent();
  renderRecent();
}

function renderRecent() {
  pruneRecent();

  const list = $("recentList");
  list.textContent = "";

  $("recent").hidden = recentStops.length === 0;

  recentStops.forEach(stop => {
    const chip = el("button", "chip", stop.name);
    chip.type = "button";
    chip.addEventListener("click", () => selectStop(stop));
    list.appendChild(chip);
  });
}

// =====================================================
// STOP SEARCH
// =====================================================

async function searchStops() {
  const rawQuery = $("searchInput").value.trim();

  if (rawQuery.length < 2) {
    setSearchMessage({ key: "searchTooShort" });
    return;
  }

  const sequence = ++searchSequence;
  const query = rawQuery.slice(0, 60);

  // "Albertstrasse" alone may match another city, so always search in Wuppertal.
  const fullQuery = normalizeName(query).includes("wuppertal")
    ? query
    : CITY_NAME + ", " + query;

  $("searchButton").disabled = true;
  stopGroups = [];
  renderStopResults();
  setSearchMessage(null);
  setStatus("statusSearching");

  try {
    const data = await apiRequest("XML_STOPFINDER_REQUEST", {
      outputFormat: "rapidJSON",
      locationServerActive: "1",
      type_sf: "stop",
      name_sf: fullQuery,
      anyObjFilter_sf: "2"
    });

    if (sequence !== searchSequence) return;

    stopGroups = mergeStops(extractLocations(data));

    if (!stopGroups.length) {
      setSearchMessage({ key: "searchNone" });
      setStatus("statusReady");
      return;
    }

    renderStopResults();
    setStatus("statusFound", { n: stopGroups.length });

  } catch (error) {
    if (sequence !== searchSequence) return;

    console.error("StopFinder error:", error);
    setSearchMessage({ key: "searchFailed", error: true, err: error });
    setStatus("statusError");

  } finally {
    if (sequence === searchSequence) {
      $("searchButton").disabled = false;
    }
  }
}

function extractLocations(data) {
  const result = [];
  const seenArrays = new Set();

  function addArray(array) {
    if (!Array.isArray(array) || seenArrays.has(array)) return;

    seenArrays.add(array);

    for (const item of array) {
      if (item && typeof item === "object") {
        result.push(item);

        // Some answers nest stops inside "assignedStops".
        addArray(item.assignedStops);
      }
    }
  }

  addArray(data?.locations);
  addArray(data?.stopFinder?.points);
  addArray(data?.stopFinder?.locations);
  addArray(data?.stopFinder?.assignedStops);
  addArray(data?.points);
  addArray(data?.assignedStops);

  return result;
}

function isWuppertalStop(location, id, name) {
  return (
    String(id).startsWith(CITY_ID_PREFIX) ||
    normalizeName(name).includes("wuppertal") ||
    String(location?.city?.name || "").toLowerCase() === "wuppertal"
  );
}

// A name key that ignores everything that only differs in spelling:
// "Wuppertal, Blankstraße", "Blankstrasse" and "Wuppertal Blankstr." all
// become "blankstr", "Wuppertal, Wuppertal Hbf" and "Hbf" become "hbf".
function stopKey(name) {
  const key = normalizeName(name)
    .replace(/ß/g, "ss")
    .replace(/wuppertal/g, "")
    .replace(/strasse/g, "str")
    .replace(/[^a-z0-9]/g, "");

  return key || normalizeName(name);
}

// Merges search results that describe the SAME stop into ONE entry:
//  - entries with the same (normalized) name, usually the two sides of a street,
//    are one stop with several station ids; the board loads all of them;
//  - entries that share a station id are the same stop even if VRR spells
//    the name differently, so they must not be offered twice.
function mergeStops(locations) {
  const groups = [];

  for (const location of locations) {
    const rawId = getStopId(location);
    const name = getStopName(location);

    if (!rawId || !name) continue;
    if (!isWuppertalStop(location, rawId, name)) continue;

    const id = toStationId(rawId);
    const key = stopKey(name);

    const matches = groups.filter(group =>
      group.keys.has(key) || group.ids.includes(id)
    );

    let target;

    if (!matches.length) {
      target = { name, keys: new Set(), ids: [] };
      groups.push(target);
    } else {
      target = matches[0];

      // This entry links several groups together -> fold them into one.
      matches.slice(1).forEach(other => {
        other.ids.forEach(otherId => {
          if (!target.ids.includes(otherId)) target.ids.push(otherId);
        });
        other.keys.forEach(otherKey => target.keys.add(otherKey));
        groups.splice(groups.indexOf(other), 1);
      });

      // Prefer the spelling that includes the city, e.g. "Wuppertal, Hbf".
      if (!/^wuppertal/i.test(target.name) && /^wuppertal/i.test(name)) {
        target.name = name;
      }
    }

    target.keys.add(key);

    if (!target.ids.includes(id)) target.ids.push(id);
  }

  // Keep the order from VRR: the best match comes first.
  return groups
    .slice(0, MAX_SEARCH_RESULTS)
    .map(group => ({
      name: group.name,
      ids: group.ids.slice(0, MAX_IDS_PER_STOP)
    }));
}

// 'de:05124:11376' -> '11376' (short form shown in the result list).
function shortId(id) {
  return String(id).split(":").pop();
}

function renderStopResults() {
  const container = $("searchResults");
  container.textContent = "";

  stopGroups.forEach(stop => {
    const button = el("button", "stop-option");
    button.type = "button";

    const name = el("strong", "", stop.name);
    const details = el("small", "", t("idsCount", { ids: stop.ids.map(shortId).join(", ") }));

    button.append(name, details);
    button.addEventListener("click", () => selectStop(stop));

    container.appendChild(button);
  });
}

function setSearchMessage(message) {
  searchMessage = message;
  renderSearchMessage();
}

function renderSearchMessage() {
  const box = $("searchMessage");

  if (!searchMessage) {
    box.hidden = true;
    box.textContent = "";
    return;
  }

  box.hidden = false;
  box.className = searchMessage.error ? "search-message error" : "search-message";
  box.textContent = resolveMessage(searchMessage);
}

function resolveMessage(message) {
  return t(message.key, {
    ...(message.vars || {}),
    reason: message.err ? explainError(message.err) : ""
  }).trim();
}

// =====================================================
// SELECT STOP
// =====================================================

function clearDepartureCacheFor(ids) {
  for (const key of [...departureCache.keys()]) {
    if (ids.some(id => key.startsWith(id + "|"))) {
      departureCache.delete(key);
    }
  }
}

async function selectStop(stop) {
  if (!stop?.ids?.length) return;

  selectedStop = { name: stop.name, ids: [...stop.ids] };
  currentPage = 0;
  selectedLine = null;
  onlyDelayed = false;
  failStreak = 0;
  nextRefreshAllowedAt = 0;
  moreGroups.clear();
  track("stop", selectedStop.name);

  allDepartures = [];
  directionGroups = [];
  summaryStats = null;
  dataUntil = null;

  expanded.clear();
  showAllStops.clear();
  tripCache.clear();
  clearDepartureCacheFor(selectedStop.ids);

  stopGroups = [];
  renderStopResults();
  setSearchMessage(null);

  pushRecent(selectedStop);
  renderRecent();

  renderBoardTitle();
  updateFilterButtons();
  renderLineFilters();
  showMessage({ key: "loadingBoard" });

  haptic();
  startAutoRefresh();
  await refreshDepartures();
}

// =====================================================
// DATE PARSING
// =====================================================

function parseDate(value) {
  if (!value) return null;

  if (value instanceof Date) {
    return Number.isNaN(value.getTime()) ? null : value;
  }

  if (typeof value === "number") {
    const date = new Date(value < 1000000000000 ? value * 1000 : value);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  if (typeof value === "string") {
    const trimmed = value.trim();

    if (!trimmed) return null;

    const date = new Date(trimmed);

    if (!Number.isNaN(date.getTime())) {
      return date;
    }

    const match = trimmed.match(
      /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );

    if (match) {
      return new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3]),
        Number(match[4]),
        Number(match[5]),
        Number(match[6] || 0)
      );
    }

    return null;
  }

  if (typeof value === "object") {
    const year = Number(value.year);
    const month = Number(value.month);
    const day = Number(value.day);
    const hour = Number(value.hour);
    const minute = Number(value.minute);
    const second = Number(value.second || 0);

    if (
      Number.isFinite(year) &&
      Number.isFinite(month) &&
      Number.isFinite(day) &&
      Number.isFinite(hour) &&
      Number.isFinite(minute)
    ) {
      return new Date(year, month - 1, day, hour, minute, second);
    }

    if (value.timestamp) return parseDate(value.timestamp);
    if (value.dateTime) return parseDate(value.dateTime);
  }

  return null;
}

function formatTime(date) {
  return date.toLocaleTimeString("de-DE", {
    hour: "2-digit",
    minute: "2-digit",
    timeZone: "Europe/Berlin"
  });
}

// =====================================================
// DEPARTURE PARSING
// =====================================================

function extractDepartures(data) {
  const result = [];

  if (Array.isArray(data?.departureList)) result.push(...data.departureList);
  if (Array.isArray(data?.stopEvents)) result.push(...data.stopEvents);
  if (Array.isArray(data?.departures)) result.push(...data.departures);

  return result;
}

function getProductText(transport, servingLine) {
  const product = transport?.product || servingLine?.product;

  let text;

  if (typeof product === "string" || typeof product === "number") {
    text = String(product);
  } else {
    text = String(
      product?.name ||
      product?.description ||
      product?.shortName ||
      ""
    );
  }

  // "Bus 628" in the transport name is a good hint when no product is given.
  return (text + " " + String(transport?.name || "")).trim();
}

function getProductClass(transport, servingLine) {
  const product = transport?.product || servingLine?.product;

  const candidates = [
    product?.class,
    product?.motType,
    servingLine?.motType,
    transport?.motType
  ];

  for (const value of candidates) {
    if (value === null || value === undefined || value === "") continue;

    const number = Number(value);

    if (Number.isFinite(number)) return number;
  }

  return null;
}

function isCancelledItem(item) {
  const flags = [
    item?.isCancelled,
    item?.cancelled,
    item?.isCanceled,
    item?.canceled,
    item?.cancelledTrip
  ];

  if (flags.some(value => value === true || value === 1 || value === "true")) {
    return true;
  }

  // realtimeStatus is an ARRAY in rapidJSON (e.g. ["MONITORED", "TRIP_CANCELLED"]).
  const status = item?.realtimeStatus;
  const list = Array.isArray(status) ? status : [status];

  return list.some(value =>
    typeof value === "string" && /cancel|ausfall/i.test(value)
  );
}

function parseDeparture(item, stationId) {
  const transport = item?.transportation || {};
  const servingLine = item?.servingLine || {};

  const planned =
    parseDate(item?.departureTimePlanned) ||
    parseDate(item?.dateTime) ||
    parseDate(item?.departureTime) ||
    parseDate(item?.plannedDateTime);

  if (!planned) return null;

  const estimatedRaw =
    parseDate(item?.departureTimeEstimated) ||
    parseDate(item?.realDateTime) ||
    parseDate(item?.estimatedDateTime);

  const estimated = estimatedRaw || planned;

  const destinationValue =
    transport?.destination?.name ||
    transport?.destination ||
    servingLine?.direction ||
    item?.direction ||
    item?.destination?.name ||
    item?.destination ||
    "—";

  const number =
    servingLine?.number ||
    transport?.number ||
    transport?.disassembledName ||
    servingLine?.name ||
    transport?.name ||
    "?";

  const platformValue =
    item?.location?.properties?.platformName ||
    item?.platformName ||
    item?.platform?.name ||
    item?.platform ||
    item?.stop?.platformName ||
    "";

  const line = String(number).trim();
  const destination = String(destinationValue).trim();

  const departure = {
    stationId: stationId || "",
    line,
    destination,
    platform: typeof platformValue === "object"
      ? String(platformValue.name || platformValue.number || "")
      : String(platformValue),
    product: getProductText(transport, servingLine),
    productClass: getProductClass(transport, servingLine),
    planned,
    estimated,
    timestamp: estimated.getTime(),
    plannedTimestamp: planned.getTime(),
    hasRealtime: Boolean(estimatedRaw),
    delay: estimatedRaw
      ? Math.round((estimatedRaw.getTime() - planned.getTime()) / 60000)
      : 0,
    cancelled: isCancelledItem(item),
    kind: "other",
    isBus: false,
    id: ""
  };

  departure.kind = classifyKind(departure);
  departure.isBus = departure.kind === "bus";
  departure.id = [
    departure.stationId,
    line,
    departure.plannedTimestamp,
    normalizeName(destination)
  ].join("|");

  return departure;
}

// "bus" | "schwebebahn" | "other"
function classifyKind(departure) {
  const text = normalizeName(departure.product);

  if (/schwebe/.test(text)) return "schwebebahn";

  // Fallback: the Wuppertal Schwebebahn is line 60 (no bus has that number).
  if (
    SCHWEBEBAHN_LINES.has(departure.line) &&
    departure.stationId.startsWith(CITY_ID_PREFIX) &&
    !/bus/.test(text)
  ) {
    return "schwebebahn";
  }

  if (BUS_CLASSES.has(departure.productClass)) return "bus";
  if (departure.productClass !== null) return "other";

  // No class given: decide by the product / transport name.
  return /bus/.test(text) ? "bus" : "other";
}

function isFutureDeparture(item) {
  return item.timestamp >= Date.now() - 60000;
}

function deduplicateDepartures(items) {
  const unique = new Map();

  for (const item of items) {
    const key = [
      item.line,
      normalizeName(item.destination),
      item.platform,
      item.plannedTimestamp,
      item.timestamp,
      item.cancelled
    ].join("|");

    const existing = unique.get(key);

    if (!existing) {
      unique.set(key, item);
    } else if (!existing.platform && item.platform) {
      existing.platform = item.platform;
    }
  }

  return [...unique.values()];
}

// =====================================================
// DEPARTURE REQUESTS
// =====================================================

// One EFA page (next N events from `start`, or from now when start is null).
// Pages are cached: the first page is shared by normal and deep mode.
async function fetchPage(stationId, start) {
  const slot = start === null ? "now" : String(Math.floor(start / 60000));
  const key = stationId + "|p|" + slot;
  const ttl = start === null ? CACHE_TTL : DEEP_PAGE_TTL;
  const cached = departureCache.get(key);

  if (cached && Date.now() - cached.timestamp < ttl) return cached.data;

  const data = await apiRequest("XML_DM_REQUEST", dmParams(stationId, start));

  const parsed = extractDepartures(data)
    .map(raw => parseDeparture(raw, stationId))
    .filter(Boolean);

  departureCache.set(key, { timestamp: Date.now(), data: parsed });

  // Keep the cache small.
  if (departureCache.size > 60) {
    const oldest = [...departureCache.entries()]
      .sort((a, b) => a[1].timestamp - b[1].timestamp)
      .slice(0, 20);
    oldest.forEach(([k]) => departureCache.delete(k));
  }

  return parsed;
}

// Departures of ONE station id.
// deep = false: one request (next N events).
// deep = true : several requests, each starting where the previous one ended,
//               until DEEP_HORIZON_MIN minutes are covered. EFA returns only
//               the next N events, so at a busy hub a rare line could
//               otherwise show up in one direction only.
async function fetchStationDepartures(stationId, deep) {
  const collected = new Map();
  const horizonEnd = Date.now() + DEEP_HORIZON_MIN * 60000;
  let start = null;

  const pages = deep ? DEEP_MAX_PAGES : 1;

  for (let page = 0; page < pages; page++) {
    let parsed;

    try {
      parsed = await fetchPage(stationId, start);
    } catch (error) {
      if (page === 0) throw error;   // nothing at all -> report the error
      break;                         // a later page failed -> keep what we have
    }

    parsed.forEach(dep => {
      if (!collected.has(dep.id)) collected.set(dep.id, dep);
    });

    if (!parsed.length) break;

    const last = Math.max(...parsed.map(dep => dep.timestamp));

    // Stop when the horizon is covered or the window did not move forward.
    if (last >= horizonEnd || (start !== null && last <= start)) break;

    start = last;
  }

  return [...collected.values()];
}

function rebuildLineKinds() {
  lineKindMap = new Map();

  for (const dep of allDepartures) {
    const known = lineKindMap.get(dep.line);
    if (!known || dep.kind === "schwebebahn") lineKindMap.set(dep.line, dep.kind);
  }
}

function lineTitle(line) {
  return lineKindMap.get(line) === "schwebebahn"
    ? t("lineTitleSb", { line })
    : t("lineTitle", { line });
}

function lineLabel(line) {
  return line;
}

async function refreshDepartures() {
  if (!selectedStop) return;

  const stop = selectedStop;
  const seq = ++refreshSeq;
  const deep = Boolean(selectedLine);

  setLoading(true);
  setStatus("statusUpdating");

  try {
    let firstError = null;

    const results = await Promise.all(
      stop.ids.map(id =>
        fetchStationDepartures(id, deep).catch(error => {
          console.error("Departure request failed:", id, error);
          firstError = firstError || error;
          return null;
        })
      )
    );

    // A newer refresh or another stop replaced this one: drop the result.
    if (seq !== refreshSeq || stop !== selectedStop) return;

    const successful = results.filter(Boolean);

    if (!successful.length) {
      throw firstError instanceof AppError && firstError.kind === "rate"
        ? firstError
        : new AppError("allFailed");
    }

    const received = successful.flat();

    dataUntil = received.length
      ? Math.max(...received.map(dep => dep.timestamp))
      : null;

    allDepartures = deduplicateDepartures(received)
      .filter(isFutureDeparture)
      .sort((a, b) => a.timestamp - b.timestamp);

    rebuildLineKinds();

    // Forget opened departures that have already left.
    const alive = new Set(allDepartures.map(dep => dep.id));
    [...expanded].forEach(id => { if (!alive.has(id)) expanded.delete(id); });

    boardMessage = null;
    failStreak = 0;
    nextRefreshAllowedAt = 0;
    lastSuccessAt = Date.now();

    buildDirectionGroups();
    renderLineFilters();
    renderBoard();

    const time = new Date().toLocaleTimeString("de-DE", {
      hour: "2-digit",
      minute: "2-digit"
    });

    setStatus(
      successful.length < stop.ids.length ? "statusUpdatedPartial" : "statusUpdated",
      { time }
    );

    refreshOpenTrips();

  } catch (error) {
    if (seq !== refreshSeq || stop !== selectedStop) return;

    console.error("Departure error:", error);

    // Exponential back-off for the automatic refresh.
    failStreak++;
    nextRefreshAllowedAt = Date.now() +
      Math.min(MAX_BACKOFF, REFRESH_INTERVAL * 2 ** failStreak);

    setStatus("statusError");

    // Keep showing the old data if we have it; otherwise show the error.
    if (!allDepartures.length) {
      showMessage({ key: "departuresFailed", error: true, err: error });
    }

  } finally {
    if (seq === refreshSeq) setLoading(false);
  }
}

// =====================================================
// STOP SEQUENCE OF A TRIP ("next stops")
// =====================================================

function onwardFromRaw(raw) {
  const list = raw?.onwardLocations;

  if (!Array.isArray(list)) return [];

  return list
    .map(location => {
      const name =
        location?.parent?.name ||
        location?.name ||
        location?.disassembledName ||
        "";

      if (!name) return null;

      const planned = parseDate(
        location?.arrivalTimePlanned || location?.departureTimePlanned
      );
      const estimatedRaw = parseDate(
        location?.arrivalTimeEstimated || location?.departureTimeEstimated
      );

      return {
        name: String(name),
        planned,
        estimated: estimatedRaw || planned,
        delay: planned && estimatedRaw
          ? Math.round((estimatedRaw.getTime() - planned.getTime()) / 60000)
          : 0
      };
    })
    .filter(Boolean);
}

// There is no "get trip by id" call in the departure monitor, so we ask for
// the events around the departure time WITH the complete stop sequence and
// pick the matching trip out of them.
async function fetchTripStops(dep) {
  const start = dep.plannedTimestamp - 120000;

  const extra = {
    limit: String(TRIP_EVENTS_LIMIT),
    includeCompleteStopSeq: "1"
  };

  let data;

  try {
    data = await apiRequest(
      "XML_DM_REQUEST",
      dmParams(dep.stationId, start, { ...extra, depType: "stopEvents" })
    );
  } catch {
    // Retry without depType in case the proxy/server dislikes it.
    data = await apiRequest("XML_DM_REQUEST", dmParams(dep.stationId, start, extra));
  }

  const wantedDestination = normalizeName(dep.destination);

  const candidates = extractDepartures(data)
    .map(raw => ({ raw, parsed: parseDeparture(raw, dep.stationId) }))
    .filter(item => item.parsed && item.parsed.line === dep.line)
    .filter(item => normalizeName(item.parsed.destination) === wantedDestination);

  const match =
    candidates.find(item => item.parsed.plannedTimestamp === dep.plannedTimestamp) ||
    candidates.find(item =>
      Math.abs(item.parsed.plannedTimestamp - dep.plannedTimestamp) <= 120000
    );

  if (!match) return [];

  const stops = onwardFromRaw(match.raw);

  if (!stops.length) {
    console.warn("VRR returned no onwardLocations. Fields:", Object.keys(match.raw));
  }

  return stops;
}

async function loadTrip(dep, force = false) {
  const previous = tripCache.get(dep.id);

  if (previous?.status === "loading") return;

  if (!force && previous?.status === "ok" && Date.now() - previous.ts < TRIP_TTL) {
    return;
  }

  tripCache.set(dep.id, {
    status: "loading",
    stops: previous?.stops || [],
    ts: previous?.ts || 0
  });
  updateTripPanel(dep.id);

  try {
    const stops = await fetchTripStops(dep);

    tripCache.set(dep.id, {
      status: stops.length ? "ok" : "empty",
      stops,
      ts: Date.now()
    });

  } catch (error) {
    console.error("Trip request failed:", dep.id, error);

    tripCache.set(dep.id, {
      status: "error",
      stops: previous?.stops || [],
      ts: Date.now()
    });
  }

  updateTripPanel(dep.id);
}

function refreshOpenTrips() {
  for (const { dep } of tripRefs.values()) {
    if (expanded.has(dep.id)) loadTrip(dep);
  }
}

function updateTripPanel(id) {
  const ref = tripRefs.get(id);

  if (ref) renderTripPanel(ref.panel, ref.dep);
}

function renderTripPanel(panel, dep) {
  panel.textContent = "";

  const state = tripCache.get(dep.id);
  const stops = state?.stops || [];

  const title = el("div", "stops-title");
  title.appendChild(el("span", "", t("tripTitle")));

  if (stops.length) {
    title.appendChild(el("small", "", t("tripCount", { n: stops.length })));
  }

  panel.appendChild(title);

  if (!state || (state.status === "loading" && !stops.length)) {
    const note = el("div", "stops-note");
    note.append(el("span", "spinner"), el("span", "", t("tripLoading")));
    panel.appendChild(note);
    return;
  }

  if (state.status === "error" && !stops.length) {
    const note = el("div", "stops-note error");
    note.appendChild(el("span", "", t("tripError")));

    const retry = el("button", "secondary", t("retry"));
    retry.type = "button";
    retry.addEventListener("click", event => {
      event.stopPropagation();
      loadTrip(dep, true);
    });

    note.appendChild(retry);
    panel.appendChild(note);
    return;
  }

  if (!stops.length) {
    panel.appendChild(el("div", "stops-note", t("tripEmpty")));
    return;
  }

  const fullList = showAllStops.has(dep.id);
  const visible = fullList ? stops : stops.slice(0, TRIP_PREVIEW_COUNT);

  const list = el("ul", "stop-list");

  // First row: where the passenger is right now.
  const here = el("li", "here");
  const hereName = el("span", "stop-name", selectedStop ? selectedStop.name : "");
  hereName.appendChild(el("small", "", t("tripHere")));
  here.append(hereName, el("span", "stop-time", formatTime(dep.estimated)));
  list.appendChild(here);

  visible.forEach((stop, index) => {
    const isLast = fullList && index === visible.length - 1;

    const item = el("li", isLast ? "end" : "");
    const name = el("span", "stop-name", shortStopName(stop.name));

    if (isLast) name.appendChild(el("small", "", t("tripEnd")));

    const time = el(
      "span",
      "stop-time",
      stop.estimated ? formatTime(stop.estimated) : "--:--"
    );

    if (stop.delay >= 1) {
      time.appendChild(
        el("small", stop.delay >= MAJOR_DELAY_MIN ? "bad" : "late", "+" + stop.delay)
      );
    }

    item.append(name, time);
    list.appendChild(item);
  });

  panel.appendChild(list);

  if (stops.length > TRIP_PREVIEW_COUNT) {
    const toggle = el(
      "button",
      "secondary stops-toggle",
      fullList ? t("tripShowLess") : t("tripShowAll", { n: stops.length })
    );
    toggle.type = "button";
    toggle.addEventListener("click", event => {
      event.stopPropagation();

      if (showAllStops.has(dep.id)) showAllStops.delete(dep.id);
      else showAllStops.add(dep.id);

      renderTripPanel(panel, dep);
    });

    panel.appendChild(toggle);
  }
}

// =====================================================
// FILTERING AND GROUPING
// =====================================================

function matchesTransport(item) {
  if (transportFilter === "bus") return item.kind === "bus";
  if (transportFilter === "schwebebahn") return item.kind === "schwebebahn";
  return true;
}

function getFilteredDepartures() {
  let result = allDepartures.filter(matchesTransport);

  if (onlyDelayed) {
    result = result.filter(item => item.cancelled || item.delay >= DELAYED_MIN);
  }

  if (selectedLine) {
    result = result.filter(item => item.line === selectedLine);
  }

  return result.sort((a, b) => a.timestamp - b.timestamp);
}

const naturalCompare = (a, b) => String(a).localeCompare(String(b), "de", { numeric: true });

function platformLabel(platform) {
  if (!platform) return t("groupNoPlatform");
  return platform.length <= 3 ? t("platform", { p: platform }) : platform;
}

// Groups the filtered departures by direction (destination), platform or line.
function buildDirectionGroups() {
  const departures = getFilteredDepartures();
  const groups = new Map();

  for (const departure of departures) {
    let key;

    if (groupMode === "platform") key = departure.platform || "";
    else if (groupMode === "line") key = departure.line;
    else key = normalizeName(departure.destination);

    if (!groups.has(key)) {
      groups.set(key, {
        id: groupMode + "|" + key,
        key,
        mode: groupMode,
        kind: departure.kind,
        total: 0,
        destinations: [],
        lines: [],
        platforms: [],
        departures: []
      });
    }

    const group = groups.get(key);
    group.total++;
    group.departures.push(departure);

    if (!group.destinations.includes(departure.destination)) {
      group.destinations.push(departure.destination);
    }
    if (!group.lines.includes(departure.line)) group.lines.push(departure.line);
    if (departure.platform && !group.platforms.includes(departure.platform)) {
      group.platforms.push(departure.platform);
    }
    if (departure.kind === "schwebebahn") group.kind = "schwebebahn";
  }

  directionGroups = [...groups.values()].map(group => {
    group.departures.sort((a, b) => a.timestamp - b.timestamp);
    group.lines.sort(naturalCompare);
    group.platforms.sort(naturalCompare);
    group.firstTs = group.departures[0]?.timestamp || Infinity;
    return group;
  });

  directionGroups.sort((a, b) => {
    if (groupMode === "direction") return a.firstTs - b.firstTs;

    // Platforms / lines in natural order; "no platform" goes last.
    if (!a.key !== !b.key) return a.key ? -1 : 1;
    return naturalCompare(a.key, b.key);
  });

  directionCount = new Set(departures.map(d => normalizeName(d.destination))).size;

  // Delay statistics over everything that matches the filters.
  const active = departures.filter(item => !item.cancelled);
  const late = active.filter(item => item.delay >= 1);

  summaryStats = departures.length
    ? {
        onTime: active.filter(item => item.hasRealtime && item.delay <= 0).length,
        late: late.length,
        maxLate: late.reduce((max, item) => Math.max(max, item.delay), 0),
        cancelled: departures.length - active.length
      }
    : null;

  const totalPages = Math.max(1, Math.ceil(directionGroups.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages - 1);
}

function groupTitle(group) {
  if (group.mode === "platform") return platformLabel(group.key);
  if (group.mode === "line") {
    return group.kind === "schwebebahn"
      ? t("lineTitleSb", { line: group.key })
      : t("lineTitle", { line: group.key });
  }
  return group.destinations[0];
}

function destinationsText(group) {
  const shown = group.destinations.slice(0, 3).join(", ");
  const rest = group.destinations.length - 3;
  return "→ " + shown + (rest > 0 ? " +" + rest : "");
}

function groupSub(group) {
  if (group.mode === "direction") {
    return t("groupLinesSub", { lines: group.lines.join(", ") });
  }
  return destinationsText(group);
}

function groupRight(group) {
  const parts = [];

  if (group.mode !== "platform" && group.platforms.length) {
    parts.push(group.platforms.length === 1
      ? platformLabel(group.platforms[0])
      : t("platformsMany", { p: group.platforms.join(", ") }));
  }

  parts.push(countText(group.total));
  return parts.join(" · ");
}

// =====================================================
// LINE FILTER BUTTONS
// =====================================================

function renderLineFilters() {
  const container = $("lineFilters");
  const caption = $("lineCaption");

  container.textContent = "";

  const departures = allDepartures.filter(matchesTransport);

  const lineSet = new Set(departures.map(item => item.line).filter(Boolean));

  // The selected line stays visible even if it has no departures right now.
  if (selectedLine) lineSet.add(selectedLine);

  const lines = [...lineSet].sort(naturalCompare);

  caption.hidden = lines.length === 0;

  lines.slice(0, MAX_LINE_BUTTONS).forEach(lineNumber => {
    const isSb = lineKindMap.get(lineNumber) === "schwebebahn";
    const button = el("button", isSb ? "line-button line-sb" : "line-button", lineLabel(lineNumber));
    button.type = "button";

    if (isSb) button.title = t("lineTitleSb", { line: lineNumber });

    if (selectedLine === lineNumber) {
      button.classList.add("active");
    }

    button.addEventListener("click", () => {
      haptic();
      selectedLine = selectedLine === lineNumber ? null : lineNumber;
      if (selectedLine) track("line", lineNumber);
      onFilterChanged({ reload: true });
    });

    container.appendChild(button);
  });
}

function updateFilterButtons() {
  $("busFilter").className = transportFilter === "bus" ? "active" : "secondary";
  $("sbFilter").className = transportFilter === "schwebebahn" ? "active" : "secondary";
  $("allFilter").className = transportFilter === "all" ? "active" : "secondary";
  $("delayedFilter").className = onlyDelayed ? "active" : "secondary";
  $("allLinesFilter").className = selectedLine ? "active" : "secondary";

  $("delayedFilter").textContent = t("filterDelayed");
  $("allLinesFilter").textContent = selectedLine
    ? t("filterLineSel", { line: lineTitle(selectedLine) })
    : t("filterAllLines");

  $("busFilter").setAttribute("aria-pressed", String(transportFilter === "bus"));
  $("sbFilter").setAttribute("aria-pressed", String(transportFilter === "schwebebahn"));
  $("allFilter").setAttribute("aria-pressed", String(transportFilter === "all"));
  $("delayedFilter").setAttribute("aria-pressed", String(onlyDelayed));

  document.querySelectorAll("#groupSwitch button").forEach(button => {
    const active = button.dataset.group === groupMode;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
}

// Re-applies the filters. With reload = true the data is fetched again,
// because a selected line is loaded further ahead in time (deep mode).
function onFilterChanged({ reload = false } = {}) {
  currentPage = 0;

  updateFilterButtons();
  renderLineFilters();

  if (selectedStop && !boardMessage) {
    buildDirectionGroups();
  }

  renderBoard();

  if (reload && selectedStop) refreshDepartures();
}

// =====================================================
// RENDER BOARD
// =====================================================

function emptyMessage() {
  if (onlyDelayed) {
    return { key: "noDelayed", vars: { min: DELAYED_MIN } };
  }

  if (selectedLine) {
    return { key: "noLine", vars: { line: selectedLine } };
  }

  if (transportFilter === "bus" && allDepartures.length) {
    return { key: "noBuses", vars: { n: allDepartures.length } };
  }

  if (transportFilter === "schwebebahn" && allDepartures.length) {
    return { key: "noSb", vars: { n: allDepartures.length } };
  }

  return { key: "noDepartures" };
}

function renderMessage(container, message) {
  const box = el("div", message.error ? "message error" : "message");
  box.textContent = resolveMessage(message);

  if (message.error && selectedStop) {
    const retry = el("button", "secondary", t("retry"));
    retry.type = "button";
    retry.addEventListener("click", () => refreshDepartures());

    box.append(document.createElement("br"), retry);
  }

  container.appendChild(box);
}

function showMessage(message) {
  boardMessage = message;
  renderBoard();
}

function countText(n) {
  return t(n === 1 ? "countOne" : "countMany", { n });
}

function renderSummary() {
  const box = $("summary");
  box.textContent = "";

  if (!summaryStats) {
    box.hidden = true;
    return;
  }

  const { onTime, late, maxLate, cancelled } = summaryStats;

  box.appendChild(el("span", "ok", t("sumOnTime", { n: onTime })));

  if (late) {
    box.appendChild(el(
      "span",
      maxLate >= MAJOR_DELAY_MIN ? "bad" : "late",
      t("sumLate", { n: late, max: maxLate })
    ));
  }

  if (cancelled) {
    box.appendChild(el("span", "bad", t("sumCancelled", { n: cancelled })));
  }

  box.hidden = false;
}

function renderDataNote(showDirectionHint) {
  const box = $("dataNote");
  box.textContent = "";

  const lines = [];

  if (dataUntil) {
    lines.push(t("dataUntil", { time: formatTime(new Date(dataUntil)) }));
  }

  if (showDirectionHint) {
    lines.push(t("singleDirection", { line: selectedLine }));
  }

  lines.forEach((text, index) => {
    if (index) box.appendChild(document.createElement("br"));
    box.appendChild(document.createTextNode(text));
  });

  box.hidden = lines.length === 0;
}

function etaText(dep) {
  const minutes = Math.floor((dep.timestamp - Date.now()) / 60000);

  if (minutes <= 0) return t("etaNow");

  if (minutes >= 60) {
    return t("etaHours", {
      h: Math.floor(minutes / 60),
      m: String(minutes % 60).padStart(2, "0")
    });
  }

  return t("etaMin", { n: minutes });
}

function renderStatusLine(dep) {
  if (dep.cancelled) return el("div", "cancelled", t("cancelled"));
  if (!dep.hasRealtime) return el("div", "no-rt", t("noRealtime"));

  if (dep.delay >= MAJOR_DELAY_MIN) {
    return el("div", "delay", t("delay", { n: dep.delay }));
  }

  if (dep.delay >= 1) {
    return el("div", "delay-minor", t("delay", { n: dep.delay }));
  }

  if (dep.delay <= -1) {
    return el("div", "early", t("early", { n: Math.abs(dep.delay) }));
  }

  return el("div", "on-time", t("onTime"));
}

function renderDeparture(dep, group) {
  const wrap = el("div", "dep-wrap");

  const row = el("div", "departure");
  row.tabIndex = 0;
  row.setAttribute("role", "button");

  const panel = el("div", "stops-panel");
  panel.hidden = !expanded.has(dep.id);

  row.setAttribute("aria-expanded", String(expanded.has(dep.id)));

  const isSb = dep.kind === "schwebebahn";
  const line = el("div", isSb ? "line line-sb" : "line", dep.line);

  const info = el("div");

  const timeRow = el("div", "time-row");
  const time = el(
    "span",
    dep.cancelled ? "time struck" : "time",
    formatTime(dep.estimated)
  );
  timeRow.appendChild(time);

  if (!dep.cancelled) {
    const eta = el("span", "eta", etaText(dep));
    timeRow.appendChild(eta);
    etaRefs.push({ el: eta, dep });
  }

  // Sub line: planned time plus whatever the card header does not show.
  const plannedParts = [t("planned", { time: formatTime(dep.planned) })];

  if (isSb) plannedParts.push(t("kindSb"));
  if (group && group.mode !== "direction") plannedParts.push("→ " + dep.destination);
  if (group && group.mode !== "platform" && group.platforms.length > 1 && dep.platform) {
    plannedParts.push(platformLabel(dep.platform));
  }

  const planned = el("div", "destination", plannedParts.join(" · "));

  info.append(timeRow, planned, renderStatusLine(dep));

  const chevron = el("div", "chev", "▾");
  chevron.setAttribute("aria-hidden", "true");

  row.append(line, info, chevron);
  wrap.append(row, panel);

  tripRefs.set(dep.id, { panel, dep });

  if (expanded.has(dep.id)) {
    renderTripPanel(panel, dep);
  }

  const toggle = () => {
    haptic();

    if (expanded.has(dep.id)) {
      expanded.delete(dep.id);
    } else {
      expanded.add(dep.id);
      renderTripPanel(panel, dep);
      track("trip", dep.line);
      loadTrip(dep);
    }

    const open = expanded.has(dep.id);
    row.setAttribute("aria-expanded", String(open));
    panel.hidden = !open;
  };

  row.addEventListener("click", toggle);
  row.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      toggle();
    }
  });

  return wrap;
}

function renderBoard() {
  const container = $("board");
  container.textContent = "";

  etaRefs = [];
  tripRefs.clear();

  $("summary").hidden = true;
  $("groupBar").hidden = true;
  $("pagination").hidden = true;
  $("dataNote").hidden = true;

  if (boardMessage) {
    renderMessage(container, boardMessage);
    return;
  }

  if (!selectedStop) {
    renderMessage(container, { key: "boardHint" });
    return;
  }

  if (!directionGroups.length) {
    renderMessage(container, emptyMessage());
    renderDataNote(false);
    return;
  }

  const totalPages = Math.ceil(directionGroups.length / PAGE_SIZE);
  currentPage = Math.min(currentPage, totalPages - 1);

  const start = currentPage * PAGE_SIZE;
  const pageGroups = directionGroups.slice(start, start + PAGE_SIZE);

  renderSummary();

  $("groupBar").hidden = false;

  const perGroup = selectedLine
    ? DEPARTURES_PER_DIRECTION_WITH_LINE
    : DEPARTURES_PER_DIRECTION;

  pageGroups.forEach(group => {
    const card = el("div", "direction");

    const title = el("div", "direction-title");
    const main = el("div", "dt-main");
    main.appendChild(el("div", "dt-title", groupTitle(group)));

    const sub = groupSub(group);
    if (sub) main.appendChild(el("div", "dt-sub", sub));

    title.append(main, el("small", "", groupRight(group)));
    card.appendChild(title);

    const open = moreGroups.has(group.id);
    const shown = open ? group.departures : group.departures.slice(0, perGroup);

    shown.forEach(dep => card.appendChild(renderDeparture(dep, group)));

    if (group.departures.length > perGroup) {
      const more = el("button", "secondary more-button", open
        ? t("groupLess")
        : t("groupMore", { n: group.departures.length - perGroup }));
      more.type = "button";
      more.addEventListener("click", () => {
        haptic();
        if (open) moreGroups.delete(group.id); else moreGroups.add(group.id);
        renderBoard();
      });
      card.appendChild(more);
    }

    container.appendChild(card);
  });

  $("pagination").hidden = totalPages <= 1;
  $("pageLabel").textContent = (currentPage + 1) + " / " + totalPages;
  $("prevButton").disabled = currentPage === 0;
  $("nextButton").disabled = currentPage >= totalPages - 1;

  const singleDirection =
    Boolean(selectedLine) && !onlyDelayed && directionCount === 1;

  renderDataNote(singleDirection);
}

function renderBoardTitle() {
  $("selectedStop").textContent = selectedStop
    ? selectedStop.name
    : t("boardTitle");
}

function renderStatus() {

function setLoading(flag) {

function renderAll() {

document.querySelectorAll("#langSwitch button").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.lang));
});

function setTransport(value) {
  if (transportFilter === value && !selectedLine) return;
  const hadLine = Boolean(selectedLine);
  transportFilter = value;
  selectedLine = null;
  track("filter", value);
  onFilterChanged({ reload: hadLine });
}

$("busFilter").addEventListener("click", () => setTransport("bus"));
$("sbFilter").addEventListener("click", () => setTransport("schwebebahn"));
$("allFilter").addEventListener("click", () => setTransport("all"));

document.querySelectorAll("#groupSwitch button").forEach(button => {
  button.addEventListener("click", () => {
    const mode = button.dataset.group;
    if (!GROUP_MODES.includes(mode) || mode === groupMode) return;

    haptic();
    groupMode = mode;
    storageSet(STORAGE_GROUP, mode);
    track("group", mode);

    moreGroups.clear();
    currentPage = 0;
    updateFilterButtons();

    if (selectedStop && !boardMessage) buildDirectionGroups();
    renderBoard();
  });
});

$("delayedFilter").addEventListener("click", () => {
  onlyDelayed = !onlyDelayed;
  onFilterChanged();
});

$("allLinesFilter").addEventListener("click", () => {
  const hadLine = Boolean(selectedLine);
  selectedLine = null;
  onFilterChanged({ reload: hadLine });
});

$("prevButton").addEventListener("click", () => {
  if (currentPage > 0) {
    currentPage--;
    renderBoard();
  }
});

$("nextButton").addEventListener("click", () => {
  const pages = Math.ceil(directionGroups.length / PAGE_SIZE);

  if (currentPage < pages - 1) {
    currentPage++;
    renderBoard();
  }
});

$("clearRecent").addEventListener("click", () => {
  haptic();
  clearRecent();
});

$("searchButton").addEventListener("click", searchStops);

$("searchInput").addEventListener("keydown", event => {
  if (event.key === "Enter") searchStops();
});

$("refreshButton").addEventListener("click", () => {
  // Throttle manual refreshes (the API proxy has a rate limit).
  if (Date.now() - lastManualAt < MANUAL_REFRESH_COOLDOWN) return;
  lastManualAt = Date.now();

  // Forced refresh: drop the cache of the selected stop.
  if (selectedStop) clearDepartureCacheFor(selectedStop.ids);

  failStreak = 0;
  nextRefreshAllowedAt = 0;
  refreshDepartures();
});

// =====================================================
// AUTO REFRESH AND COUNTDOWN
// =====================================================

function startAutoRefresh() {
  stopAutoRefresh();

  refreshTimer = setInterval(() => {
    if (
      selectedStop && !document.hidden &&
      Date.now() >= nextRefreshAllowedAt &&
      Date.now() >= rateLimitedUntil
    ) {
      refreshDepartures();
    }
  }, REFRESH_INTERVAL);
}

function stopAutoRefresh() {
  if (refreshTimer) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

// Updates the "in N min" labels without a network request and removes
// departures that have already left.
etaTimer = setInterval(() => {
  if (document.hidden || !selectedStop || boardMessage) return;

  if (allDepartures.some(item => !isFutureDeparture(item))) {
    allDepartures = allDepartures.filter(isFutureDeparture);
    buildDirectionGroups();
    renderLineFilters();
    renderBoard();
    return;
  }

  etaRefs.forEach(({ el: node, dep }) => {
    node.textContent = etaText(dep);
  });
}, ETA_TICK_INTERVAL);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) renderRecent();

  // Refresh on return only when the data is really old.
  if (
    !document.hidden && selectedStop &&
    Date.now() - lastSuccessAt > VISIBILITY_REFRESH_MIN &&
    Date.now() >= rateLimitedUntil
  ) {
    refreshDepartures();
  }
});

// =====================================================
// ANONYMOUS STATISTICS (optional, disabled while STATS_URL is empty)
// =====================================================

let statsSent = 0;

function doNotTrack() {
  return navigator.doNotTrack === "1" || window.doNotTrack === "1";
}

function statsEnabled() {
  return Boolean(STATS_URL) && !doNotTrack() && storageGet(STORAGE_STATS) !== "off";
}

// Sends one anonymous counter event. No identifiers are stored on the device;
// the server only counts. Never throws and never blocks the UI.
function track(event, key) {
  if (!statsEnabled() || statsSent >= STATS_MAX_EVENTS) return;
  statsSent++;

  try {
    fetch(STATS_URL, {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      keepalive: true,
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({
        e: event,
        k: key ? String(key).slice(0, 60) : "",
        v: APP_VERSION
      })
    }).catch(() => {});
  } catch { /* ignore */ }
}
